<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Original Starwalker</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;             
      background: black;
      display: flex;           
      align-items: center;      
      justify-content: center;  
    }

    img {
      max-width: 100%;         
      max-height: 100%;        
      height: auto;             
      width: auto;               
      display: block;            
    }
  </style>
</head>
<body>
  <img src="assets/starwalker 2.jpg" alt="Starwalker">

  <script>
    document.addEventListener('click', () => {
      try {
        const sound = new Audio('assets/click.mp3');
        sound.volume = 0.18;
        sound.play().catch(()=>{});
      } catch(e){}
    }, true);
  </script>
</body>
</html>
