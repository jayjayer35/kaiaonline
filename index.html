<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>* (The girl on the cliff.).</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">
  <img id="scene-layer-0" class="scene-layer" alt="">
  <img id="scene-layer-1" class="scene-layer" alt="">

  <div id="textbox">
    <div id="dialogue-text"></div>
    <div id="choice-grid"></div>
  </div>

  <!-- press C to open/close this -- see MENU_ENTRIES in script.js to
       customize the ITEM/STAT/CELL-style list. The stats box above it
       (name/LV/HP/G) is plain static markup -- edit the values directly
       below whenever they change. -->
  <div id="menu-box">
    <div id="stats-box">
      <div id="stats-name">Kaia</div>
      <div class="stats-row"><span class="stat-label">LV</span><span>3</span></div>
      <div class="stats-row"><span class="stat-label">HP</span><span>28/28</span></div>
      <div class="stats-row"><span class="stat-label">G</span><span>51</span></div>
    </div>
    <div id="nav-box">
      <div id="menu-list"></div>
    </div>
  </div>

  <!-- opened by selecting ITEM in the menu -- see ITEMS/addItem() in
       script.js. Positioned next to menu-box by JS at open time, since
       menu-box's width changes depending on its content. -->
  <div id="item-box">
    <div id="item-list"></div>
    <div id="item-actions"></div>
  </div>

  <!-- opened by selecting LOG in the menu -- see SCENES in script.js.
       Picking an entry replays that old scene using the normal dialogue
       engine, without touching your real progress. -->
  <div id="scene-log-box">
    <div id="scene-log-list"></div>
  </div>

  <!-- opened by selecting STAT in the menu -- purely informational,
       nothing here is selectable. Everything except WEAPON/ARMOR is
       plain static markup -- edit the values directly whenever they
       change, same as the corner stats box above. WEAPON/ARMOR are
       filled in by script.js from whatever's currently equipped (see
       `equipped` and useSelectedItem() in script.js). -->
  <div id="stat-screen">
    <div id="stat-screen-name">"Kaia"</div>

    <div class="stat-screen-row"><span class="stat-screen-label">LV</span><span>3</span></div>
    <div class="stat-screen-row"><span class="stat-screen-label">HP</span><span>28 / 28</span></div>

    <div class="stat-screen-grid">
      <div class="stat-screen-row"><span class="stat-screen-label">AT</span><span>4 (0)</span></div>
      <div class="stat-screen-row"><span class="stat-screen-label">EXP:</span><span>50</span></div>
      <div class="stat-screen-row"><span class="stat-screen-label">DF</span><span>0 (0)</span></div>
      <div class="stat-screen-row"><span class="stat-screen-label">NEXT:</span><span>20</span></div>
    </div>

    <div class="stat-screen-row section-start"><span class="stat-screen-label">WEAPON: </span><span id="stat-screen-weapon">None</span></div>
    <div class="stat-screen-row"><span class="stat-screen-label">ARMOR: </span><span id="stat-screen-armor">None</span></div>

    <div class="stat-screen-grid">
      <div class="stat-screen-row"><span class="stat-screen-label">GOLD: </span><span>51</span></div>
      <div class="stat-screen-row"><span class="stat-screen-label">KILLS: </span><span>15</span></div>
    </div>
  </div>
</div>
<!-- MAKE SURE TO CALL A NEW SCENE ON UPDATE-->
<script src="dialogue/scene2.js"></script>
<script src="script.js"></script>
</body>
</html>
