<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>* (The girl on the cliff.).</title>
<style>

  @font-face {
    font-family: 'DialogueFont';
    src: url('/assets/big-shot.ttf') format('truetype');
    font-display: block;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
  }

  body {
    cursor: default;
  }

  #game {
    position: absolute;
    top: 0;
    left: 0;
    width: 640px;
    height: 480px;
    background: #000;
    transform-origin: top left;
    image-rendering: pixelated;
    overflow: hidden;
  }

  .scene-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 640px;
    height: 480px;
    object-fit: cover;
    image-rendering: pixelated;
    opacity: 0;
    transition: opacity 1.2s ease;
  }

  #textbox {
    position: absolute;
    left: 25px;
    top: 328px;
    width: 590px;
    height: 122px;
    background: #000;
    border: 4px solid #fff;
    padding: 14px 18px;
    opacity: 1;
    z-index: 10;
  }

  #dialogue-text {
    font-family: 'DialogueFont', monospace;
    color: #fff;
    font-size: 24px;
    line-height: 1.25em;
    white-space: pre-wrap;
    letter-spacing: 1px;

    height: calc(1.35em * 3);
    overflow: hidden;
  }

</style>
</head>
<body>

<div id="game">
  <img id="scene-layer-0" class="scene-layer" alt="">
  <img id="scene-layer-1" class="scene-layer" alt="">
  <div id="textbox">
    <div id="dialogue-text"></div>
  </div>
</div>

<script>

  const game = document.getElementById('game');
  const NATIVE_W = 640;
  const NATIVE_H = 480;

  function resize() {
    const scale = Math.min(window.innerWidth / NATIVE_W, window.innerHeight / NATIVE_H);
    const offsetX = (window.innerWidth - NATIVE_W * scale) / 2;
    const offsetY = (window.innerHeight - NATIVE_H * scale) / 2;
    game.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
  }

  window.addEventListener('resize', resize);
  resize();

  // ---- dialogue system ----
  //   [p:300]              -- a pause in ms
  //   [c:red]word[/c]      -- colors, use css color name (hex code might word lulz)
  //   [music:/path.mp3]    -- starts playing specified track
  //   [hide]               -- fades the whole textbox out

  const DIALOGUE = [
    ".[p:600].[p:600].[p:600][p:1000]\n(press Z)[p:2000]\n((or tap screen))", //1
    "Hi! [p:600]It's nice to see you here!",
    "So,[p:200] I real[p:200]l[p:200]l[p:200]l[p:200]y[p:200] don't want to stop using this website.[p:500]\n(If that much wasn't clear...) ",
    "I've become attached to it,[p:200] y'know?[p:1000]\nIt's like a little sanctuary.",
    "[music:/music/vigil.mp3].[p:600].[p:600].[p:600]",
    "Sure,[p:1000] my relationship with it might be a little odd...",
    "But I have the power to [c:gold]change[/c] that!",
    "You see,[p:200] I have NOT been thinking with a clear mind these past few days.",
    "Constant back and forth with myself trying to figure out what's best for me.",
    "While also trying to run damage control so I don't really lose my friends.",
    "It's been a little stressful to say the least.",
    ".[p:600].[p:600].[p:600]",
    "so...",
    "I want to use this as a little outlet to specifically focus on the [c:lime]good[/c] that goes on in my life!",
    "I know that it won't magically solve everything for me.[p:600].[p:600].",
    "But it's fulfilling and meaningful to me,[p:400] to do it through here,[p:400] so that's what I'll do!",
    "There isn't much to put here as of right now though.",
    "Since I spent the majority of my time making this look like an undertale dialogue box...",
    "And also learning to use Aseprite for the art...",
    "And then spending hours to draw and animate something that looked halfway decent...",
    "But I'm really proud of it!",
    ".[p:600].[p:600].[p:600]",
    "Even the little dialogue blip is a clip of my voice too![p:600]\nI hope it isn't too annoying,[p:400] haha.",
    "Anyways,[p:400] I look forward to making little doodles and animations for this![p:600]\nOh,[p:400] and music!",
    "'Cause even the song is something I made myself![p:600]\nIt's called 'Vigil'.",
    "It's original purpose was for D&D,[p:400] but it's an extremely calming song to me.",
    "So it will probably the be go-to song used here in my little talks.",
    ".[p:600].[p:600].[p:600]",
    "Welp,[p:400] that's it for now I suppose!",
    "Stick around and chill,[p:400] listen to the music with me if you so please.",
    "Or just take your cursor up to the little [x] and close me out.",
    "It was fun talking![p:600]\nSee you next time!",
    "<3[p:600][hide]"
    ];

  const IMAGES = [
    "",
    "",
    "",
    "",
    "/assets/anim/kicks.gif",
    "",
    "/assets/anim/looking.gif",
    "/assets/anim/lookaway.gif",
    "",
    "",
    "", 
    "",
    "/assets/anim/looking.gif",
    "/assets/anim/kicks.gif",
    "/assets/anim/lookaway.gif",
    "/assets/anim/sing.gif",
    "/assets/anim/talky.gif",
    "",
    "",
    "/assets/anim/lookaway.gif",
    "/assets/anim/sing.gif",
    "/assets/anim/kicks.gif",
    "",
    "",
    "/assets/anim/looking.gif",
    "/assets/anim/sing.gif",
    "/assets/anim/kicks.gif",
    "",
    "/assets/anim/looking.gif",
    "/assets/anim/kicks.gif",
    "",
    "/assets/anim/waving.gif",
    "/assets/anim/kicks.gif",
  ];
  // big = slower
  const TYPE_SPEED_MS = 45;

  const textEl = document.getElementById('dialogue-text');
  const textboxEl = document.getElementById('textbox');
  const sceneLayers = [
    document.getElementById('scene-layer-0'),
    document.getElementById('scene-layer-1')
  ];
  let activeLayer = 0;
  let currentImageSrc = '';

  function hideTextbox() {
    textboxEl.style.opacity = '0';
  }

  function showTextbox() {
    textboxEl.style.opacity = '1';
  }

  const preloadedSrcs = new Set();
  IMAGES.forEach((src) => {
    if (src && !preloadedSrcs.has(src)) {
      preloadedSrcs.add(src);
      const img = new Image();
      img.src = src;
      if (img.decode) {
        img.decode().catch(() => {}); 
      }
    }
  });
  function setSceneImage(src) {
    if (!src || src === currentImageSrc) return;
    const isFirstImage = currentImageSrc === '';
    currentImageSrc = src;

    const incomingLayer = 1 - activeLayer;
    const incomingEl = sceneLayers[incomingLayer];
    const outgoingEl = sceneLayers[activeLayer];

    if (isFirstImage) {
      incomingEl.style.transition = '';
      incomingEl.src = src;
      incomingEl.style.zIndex = '0';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          incomingEl.style.opacity = '1';
        });
      });
    } else {
      incomingEl.style.transition = 'none';
      incomingEl.src = src;
      incomingEl.style.zIndex = '0';
      incomingEl.style.opacity = '1';

      outgoingEl.style.transition = 'none';
      outgoingEl.style.zIndex = '0';
      outgoingEl.style.opacity = '0';

      void incomingEl.offsetHeight; // 
      incomingEl.style.transition = '';
      outgoingEl.style.transition = '';
    }

    activeLayer = incomingLayer;
  }
  //blip
  const TYPE_SOUND_SRC = '/assets/blipmain.wav';
  const TYPE_SOUND_VOLUME = 0.4;
  const typeSound = new Audio(TYPE_SOUND_SRC);
  typeSound.volume = TYPE_SOUND_VOLUME;

  function playTypeSound() {
    typeSound.pause();
    typeSound.currentTime = 0;
    typeSound.play().catch(() => {});
  }

  // VOLUMES!!!!
  const MUSIC_VOLUME = 0.03;
  const MUSIC_FADE_MS = 1500;

  const musicLayers = [new Audio(), new Audio()];
  musicLayers.forEach((a) => { a.loop = true; a.volume = 0; });
  let activeMusicLayer = 0;
  let currentMusicSrc = '';

  function fadeAudio(audioEl, targetVolume, durationMs, onComplete) {
    const startVolume = audioEl.volume;
    const startTime = performance.now();
    function step(now) {
      if (typeof now !== 'number' || !isFinite(now)) {
        now = performance.now();
      }
      const t = Math.min(Math.max((now - startTime) / durationMs, 0), 1);
      const nextVolume = startVolume + (targetVolume - startVolume) * t;
      audioEl.volume = isFinite(nextVolume) ? Math.min(1, Math.max(0, nextVolume)) : targetVolume;
      if (t < 1) {
        requestAnimationFrame(step);
      } else if (onComplete) {
        onComplete();
      }
    }
    requestAnimationFrame(step);
  }

  function playMusic(src) {
    if (!src || src === currentMusicSrc) return;
    currentMusicSrc = src;

    const nextLayer = 1 - activeMusicLayer;
    const nextEl = musicLayers[nextLayer];
    const curEl = musicLayers[activeMusicLayer];

    nextEl.src = src;
    nextEl.currentTime = 0;
    nextEl.volume = 0;
    nextEl.play().catch((err) => console.warn('music playback blocked:', err));
    fadeAudio(nextEl, MUSIC_VOLUME, MUSIC_FADE_MS);

    fadeAudio(curEl, 0, MUSIC_FADE_MS, () => curEl.pause());

    activeMusicLayer = nextLayer;
  }
  function parseDialogueMarkup(rawStr) {
    const str = '* ' + rawStr.replace(/\n/g, '\n* ');
    const tokens = [];
    const colorStack = [];
    let i = 0;
    while (i < str.length) {
      const ch = str[i];
      if (ch === '[') {
        const close = str.indexOf(']', i);
        if (close !== -1) {
          const tag = str.slice(i + 1, close);
          if (tag.startsWith('p:')) {
            tokens.push({ type: 'pause', ms: parseInt(tag.slice(2), 10) || 0 });
            i = close + 1;
            continue;
          }
          if (tag.startsWith('c:')) {
            colorStack.push(tag.slice(2));
            i = close + 1;
            continue;
          }
          if (tag === '/c') {
            colorStack.pop();
            i = close + 1;
            continue;
          }
          if (tag === 'hide') {
            tokens.push({ type: 'hide' });
            i = close + 1;
            continue;
          }
          if (tag.startsWith('music:')) {
            tokens.push({ type: 'music', src: tag.slice(6) });
            i = close + 1;
            continue;
          }
        }
      }
      tokens.push({ type: 'char', ch, color: colorStack[colorStack.length - 1] || null });
      i++;
    }
    return tokens;
  }

  function escapeHtml(ch) {
    if (ch === '<') return '&lt;';
    if (ch === '>') return '&gt;';
    if (ch === '&') return '&amp;';
    if (ch === '"') return '&quot;';
    return ch;
  }

  function renderRevealed(revealed) {
    let html = '';
    for (const t of revealed) {
      const safe = escapeHtml(t.ch);
      html += t.color ? `<span style="color:${t.color}">${safe}</span>` : safe;
    }
    textEl.innerHTML = html;
  }

  let pageIndex = 0;
  let currentTokens = [];
  let tokenIndex = 0;
  let revealed = [];
  let typing = false;
  let typeTimer = null;

  function startPage(index) {
    if (index >= DIALOGUE.length) return;
    pageIndex = index;
    currentTokens = parseDialogueMarkup(DIALOGUE[pageIndex]);
    tokenIndex = 0;
    revealed = [];
    typing = true;
    textEl.innerHTML = '';
    clearTimeout(typeTimer);

    showTextbox();
    setSceneImage(IMAGES[pageIndex]);

    typeStep();
  }

  function typeStep() {
    if (tokenIndex >= currentTokens.length) {
      typing = false;
      return;
    }

    const token = currentTokens[tokenIndex];
    tokenIndex++;

    if (token.type === 'pause') {
      typeTimer = setTimeout(typeStep, token.ms);
      return;
    }

    if (token.type === 'hide') {
      hideTextbox();
      typeTimer = setTimeout(typeStep, 0);
      return;
    }

    if (token.type === 'music') {
      playMusic(token.src);
      typeTimer = setTimeout(typeStep, 0);
      return;
    }

    revealed.push(token);
    renderRevealed(revealed);
    if (!/\s/.test(token.ch)) {
      playTypeSound();
    }

    if (tokenIndex >= currentTokens.length) {
      typing = false;
      return;
    }
    typeTimer = setTimeout(typeStep, TYPE_SPEED_MS);
  }

  function finishTyping() {
    clearTimeout(typeTimer);
    revealed = currentTokens.filter((t) => t.type === 'char');
    renderRevealed(revealed);
    if (currentTokens.some((t) => t.type === 'hide')) {
      hideTextbox();
    }
    currentTokens
      .filter((t) => t.type === 'music')
      .forEach((t) => playMusic(t.src));
    tokenIndex = currentTokens.length;
    typing = false;
  }

  function handleZ() {
    if (typing) return;
    if (pageIndex < DIALOGUE.length - 1) {
      startPage(pageIndex + 1);
    } else {
      hideTextbox();
    }
  }

  function handleX() {
    if (typing) {
      finishTyping();
    }
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'z') {
      e.preventDefault();
      handleZ();
    } else if (k === 'x') {
      e.preventDefault();
      handleX();
    }
  });

  window.addEventListener('touchend', (e) => {
    e.preventDefault();
    handleZ();
  }, { passive: false });

  startPage(0);

</script>

</body>
</html>
