<script type="module">
const TREE_SRC = '/assets/tree.gif';
const SCALE = 3;
const CELL_SIZE = 9;
const CHARSET = Array.from(' \-+=.()<>:');
const COLOR_MODE = 'source';
const INK = '#e8b900';
const BACKDROP = '#000000';
const DARK_CUTOFF = 0.10;

const img = document.querySelector('.gif-wrap img');
const pre = document.getElementById('ascii-tree');

let cols = 0;
let rows = 0;
let small = null;
let smallCtx = null;

function toHex(r, g, b) {
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

function setupGrid(w, h) {
  const fontPx = CELL_SIZE / 0.6;
  pre.style.fontSize = fontPx + 'px';
  pre.style.lineHeight = fontPx + 'px';
  pre.style.background = BACKDROP;
  pre.style.position = 'absolute';
  pre.style.visibility = 'hidden';
  pre.style.display = 'block';

  const probe = document.createElement('span');
  probe.textContent = CHARSET[CHARSET.length - 1].repeat(20);
  pre.appendChild(probe);
  const charW = probe.getBoundingClientRect().width / 20 || CELL_SIZE;
  probe.remove();

  cols = Math.max(1, Math.round((w * SCALE) / charW));
  rows = Math.max(1, Math.round((h * SCALE) / fontPx));

  small = document.createElement('canvas');
  small.width = cols;
  small.height = rows;
  smallCtx = small.getContext('2d', { willReadFrequently: true });
  smallCtx.imageSmoothingEnabled = true;
  smallCtx.imageSmoothingQuality = 'high';
}

function frameToHtml(source) {
  smallCtx.clearRect(0, 0, cols, rows);
  smallCtx.drawImage(source, 0, 0, cols, rows);
  const data = smallCtx.getImageData(0, 0, cols, rows).data;
  const lines = [];

  for (let y = 0; y < rows; y++) {
    let line = '';
    let run = '';
    let runColor = null;
    const flush = () => {
      if (!run) return;
      line += runColor ? `<span style="color:${runColor}">${run}</span>` : run;
      run = '';
    };

    for (let x = 0; x < cols; x++) {
      const i = (y * cols + x) * 4;
      const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3] / 255;
      const lum = ((0.299 * r + 0.587 * g + 0.114 * b) / 255) * a;
      const ch = lum < DARK_CUTOFF
        ? ' '
        : CHARSET[Math.max(0, Math.min(CHARSET.length - 1, Math.round(lum * (CHARSET.length - 1))))];
      const color = ch === ' ' ? runColor : (COLOR_MODE === 'source' ? toHex(r, g, b) : INK);
      if (color !== runColor) {
        flush();
        runColor = color;
      }
      run += ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch;
    }
    flush();
    lines.push(line);
  }
  return lines.join('\n');
}

function reveal() {
  img.remove();
  pre.style.position = '';
  pre.style.visibility = 'visible';
}

function showGifInstead() {
  pre.style.display = 'none';
  img.style.width = (img.naturalWidth * SCALE) + 'px';
  img.style.visibility = 'visible';
}

let frames = [];
let frameIndex = 0;
let pointerOnTree = false;
let paused = false;

function updatePaused() {
  const sel = window.getSelection();
  const selecting = sel && !sel.isCollapsed &&
    (pre.contains(sel.anchorNode) || pre.contains(sel.focusNode));
  paused = pointerOnTree || selecting;
}

pre.addEventListener('pointerdown', () => {
  pointerOnTree = true;
  updatePaused();
});
window.addEventListener('pointerup', () => {
  pointerOnTree = false;
  updatePaused();
});
document.addEventListener('selectionchange', updatePaused);

function tick() {
  if (!paused) {
    frameIndex = (frameIndex + 1) % frames.length;
    pre.innerHTML = frames[frameIndex].html;
  }
  setTimeout(tick, frames[frameIndex].delay);
}

async function loadAnimated() {
  const { parseGIF, decompressFrames } = await import('https://esm.sh/gifuct-js@2.1.2');
  const res = await fetch(TREE_SRC);
  if (!res.ok) throw new Error('gif download failed');
  const gif = parseGIF(await res.arrayBuffer());
  const raw = decompressFrames(gif, true);
  const w = gif.lsd.width;
  const h = gif.lsd.height;
  if (!raw.length) throw new Error('no frames');

  setupGrid(w, h);

  const full = document.createElement('canvas');
  full.width = w;
  full.height = h;
  const fullCtx = full.getContext('2d', { willReadFrequently: true });
  const patch = document.createElement('canvas');
  const patchCtx = patch.getContext('2d');
  let saved = null;

  raw.forEach((f, i) => {
    const prev = raw[i - 1];
    if (prev && prev.disposalType === 2) {
      fullCtx.clearRect(prev.dims.left, prev.dims.top, prev.dims.width, prev.dims.height);
    }
    if (prev && prev.disposalType === 3 && saved) fullCtx.putImageData(saved, 0, 0);
    saved = f.disposalType === 3 ? fullCtx.getImageData(0, 0, w, h) : null;

    patch.width = f.dims.width;
    patch.height = f.dims.height;
    patchCtx.putImageData(new ImageData(new Uint8ClampedArray(f.patch), f.dims.width, f.dims.height), 0, 0);
    fullCtx.drawImage(patch, f.dims.left, f.dims.top);

    frames.push({ html: frameToHtml(full), delay: Math.max(20, f.delay) });
  });

  pre.innerHTML = frames[0].html;
  reveal();
  if (frames.length > 1) setTimeout(tick, frames[0].delay);
}

async function loadStill() {
  await img.decode();
  setupGrid(img.naturalWidth, img.naturalHeight);
  pre.innerHTML = frameToHtml(img);
  reveal();
}

try {
  await loadAnimated();
} catch (e) {
  try {
    await loadStill();
  } catch (e2) {
    showGifInstead();
  }
}
</script>

const ui = document.getElementById('ui');
const NATIVE_W = 640;
const NATIVE_H = 480;

function resize() {
  const scale = Math.min(window.innerWidth / NATIVE_W, window.innerHeight / NATIVE_H);
  const offsetX = (window.innerWidth - NATIVE_W * scale) / 2;
  const offsetY = (window.innerHeight - NATIVE_H * scale) / 2;

function createBlipPlayer(src, volume, poolSize = 6) {
  const pool = [];
  for (let i = 0; i < poolSize; i++) {
    const a = new Audio(src);
    a.volume = volume;
    pool.push(a);
  }
  let next = 0;
  return function playBlip() {
    const a = pool[next];
    next = (next + 1) % pool.length;
    a.pause();
    a.currentTime = 0;
    a.play().catch(() => {});
  };
}

const playTypeSound = createBlipPlayer('/assets/blip_none.wav', 0.4);
const playMenuSelectSound = createBlipPlayer('/assets/menu_sound/menu_select.wav', 0.1, 3);

const CURSOR_SRC = '/assets/soul_select.png';
const CHOICE_COLS = 2;
const TYPE_SPEED_MS = 45;

const textboxEl = document.getElementById('textbox');
const textEl = document.getElementById('dialogue-text');
const choiceGridEl = document.getElementById('choice-grid');

function parseDialogueMarkup(rawStr) {
  const str = '* ' + rawStr.replace(/\n/g, '\n* ');
  const tokens = [];
  const colorStack = [];
  let i = 0;
  while (i < str.length) {
    const ch = str[i];
    if (ch === '[') {
      const close = str.indexOf(']', i);
      if (close !== -1) {
        const tag = str.slice(i + 1, close);
        if (tag.startsWith('p:')) {
          tokens.push({ type: 'pause', ms: parseInt(tag.slice(2), 10) || 0 });
          i = close + 1;
          continue;
        }
        if (tag.startsWith('c:')) {
          colorStack.push(tag.slice(2));
          i = close + 1;
          continue;
        }
        if (tag === '/c') {
          colorStack.pop();
          i = close + 1;
          continue;
        }
      }
    }
    tokens.push({ type: 'char', ch, color: colorStack[colorStack.length - 1] || null });
    i++;
  }
  return tokens;
}

function escapeHtml(ch) {
  if (ch === '<') return '&lt;';
  if (ch === '>') return '&gt;';
  if (ch === '&') return '&amp;';
  if (ch === '"') return '&quot;';
  return ch;
}

function charsToHtml(chars) {
  let html = '';
  for (const t of chars) {
    const safe = escapeHtml(t.ch);
    const wrapped = t.ch === ' ' ? `<span class="wide-space">${safe}</span>` : safe;
    html += t.color ? `<span style="color:${t.color}">${wrapped}</span>` : wrapped;
  }
  return html;
}

let currentNodeId = null;
let tokens = [];
let tokenIndex = 0;
let revealed = [];
let typing = false;
let typeTimer = null;
let choiceActive = false;
let currentChoices = [];
let choiceIndex = 0;

const treeEl = document.querySelector('.gif-wrap');

function startNode(id) {
  const node = NODES[id];
  if (!node) {
    closeBox();
    return;
  }
  treeEl.style.visibility = node.hideTree ? 'hidden' : '';
  currentNodeId = id;
  clearTimeout(typeTimer);
  hideChoiceGrid();
  tokens = parseDialogueMarkup(node.text);
  tokenIndex = 0;
  revealed = [];
  typing = true;
  textEl.innerHTML = '';
  typeStep();
}

function typeStep() {
  if (tokenIndex >= tokens.length) {
    doneTyping();
    return;
  }
  const token = tokens[tokenIndex++];
  if (token.type === 'pause') {
    typeTimer = setTimeout(typeStep, token.ms);
    return;
  }
  revealed.push(token);
  textEl.innerHTML = charsToHtml(revealed);
  if (!/\s/.test(token.ch)) playTypeSound();
  typeTimer = setTimeout(typeStep, TYPE_SPEED_MS);
}

function finishTyping() {
  if (!typing) return;
  clearTimeout(typeTimer);
  revealed = tokens.filter((t) => t.type === 'char');
  textEl.innerHTML = charsToHtml(revealed);
  doneTyping();
}

function doneTyping() {
  typing = false;
  const node = NODES[currentNodeId];
  if (node && node.choices && node.choices.length) {
    showChoiceGrid(node.choices);
  }
}

function cursorImgHtml() {
  return `<img class="cursor-icon" src="${CURSOR_SRC}" alt="">`;
}

function showChoiceGrid(choices) {
  currentChoices = choices;
  choiceIndex = 0;
  choiceActive = true;
  textEl.style.display = 'none';
  choiceGridEl.style.display = 'grid';
  renderChoiceGrid();
}

function hideChoiceGrid() {
  choiceActive = false;
  currentChoices = [];
  choiceGridEl.style.display = 'none';
  choiceGridEl.innerHTML = '';
  textEl.style.display = '';
}

function renderChoiceGrid() {
  let html = '';
  currentChoices.forEach((choice, i) => {
    const cursor = i === choiceIndex ? cursorImgHtml() : '';
    let label = '';
    for (const ch of choice.label) label += escapeHtml(ch);
    html += `<div class="choice-cell" data-index="${i}">${cursor}${label}</div>`;
  });
  choiceGridEl.innerHTML = html;
  choiceGridEl.querySelectorAll('.choice-cell').forEach((el) => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      choiceIndex = parseInt(el.dataset.index, 10);
      confirmChoice();
    });
  });
}

function moveChoiceGrid(dRow, dCol) {
  if (!currentChoices.length) return;
  const total = currentChoices.length;
  const rows = Math.ceil(total / CHOICE_COLS);
  let row = Math.floor(choiceIndex / CHOICE_COLS);
  let col = choiceIndex % CHOICE_COLS;
  row = (row + dRow + rows) % rows;
  col = (col + dCol + CHOICE_COLS) % CHOICE_COLS;
  let newIndex = row * CHOICE_COLS + col;
  if (newIndex >= total) newIndex = total - 1;
  if (newIndex !== choiceIndex) {
    choiceIndex = newIndex;
    renderChoiceGrid();
    playMenuSelectSound();
  }
}

function confirmChoice() {
  const choice = currentChoices[choiceIndex];
  hideChoiceGrid();
  if (choice && choice.next) startNode(choice.next);
  else closeBox();
}

function advance() {
  if (typing) return;
  if (choiceActive) {
    confirmChoice();
    return;
  }
  const node = NODES[currentNodeId];
  if (node && node.next) startNode(node.next);
  else closeBox();
}

function openBox() {
  textboxEl.classList.add('open');
}

function closeBox() {
  clearTimeout(typeTimer);
  hideChoiceGrid();
  currentNodeId = null;
  treeEl.style.visibility = '';
  textboxEl.classList.remove('open');
}

textboxEl.addEventListener('click', advance);

window.addEventListener('keydown', (e) => {
  if (!textboxEl.classList.contains('open')) return;
  const k = e.key.toLowerCase();
  if (k === 'z' || k === 'enter') {
    e.preventDefault();
    advance();
  } else if (k === 'x' || k === 'shift') {
    e.preventDefault();
    finishTyping();
  } else if (choiceActive && k === 'arrowleft') {
    e.preventDefault();
    moveChoiceGrid(0, -1);
  } else if (choiceActive && k === 'arrowright') {
    e.preventDefault();
    moveChoiceGrid(0, 1);
  } else if (choiceActive && k === 'arrowup') {
    e.preventDefault();
    moveChoiceGrid(-1, 0);
  } else if (choiceActive && k === 'arrowdown') {
    e.preventDefault();
    moveChoiceGrid(1, 0);
  }
});

let listenedMs = 0;
let lastTick = performance.now();
let promptShown = false;

const listenTimer = setInterval(() => {
  const now = performance.now();
  const dt = Math.min(now - lastTick, 1000);
  lastTick = now;

  if (!audio.paused && !document.hidden) listenedMs += dt;

  if (listenedMs >= PROMPT_DELAY_MS && !promptShown) {
    promptShown = true;
    clearInterval(listenTimer);
    openBox();
    startNode('start');
  }
}, 250);
