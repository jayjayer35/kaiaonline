<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info Tile Page</title>

  <style>
    @font-face {
      font-family: "NDS";
      src: url("../assets/fonts/nds.ttf") format("truetype");
      font-display: swap;
    }

    body {
      margin: 0;
      font-family: "NDS", monospace;
      background: url("../assets/general/bkg1.png") repeat; 
      color: #202020;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .tile {
      width: 80%;
      max-width: 600px;
      padding: 1.5rem;
      border: 4px solid #b6c6df;
      background-color: #f9fafb;
      box-shadow: 6px 6px 0 #7e8ba3;
      border-radius: 10px;
      text-align: center;
      font-size: 1.1rem;
    }

    .tile h1 {
      margin-top: 0;
      font-size: 1.5rem;
      text-shadow: 2px 2px #b6c6df;
    }

    .tile p {
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="tile">
    <h1>welcome to my site!</h1>
    <p>
      lorem ipsum
    </p>
  </div>

</body>
</html>
