<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thalenrose</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: #1b1b1b;
      overflow: hidden;
      font-family: "Garamond", serif;
    }

    #map {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      cursor: grab;
      transition: transform 0.5s ease;
    }

    .leaflet-container { background: #1b1b1b; }

    .leaflet-tooltip {
      background-color: #272522 !important;
      color: #ffffff !important;
      border: 1px solid #ffffff !important;
      font-family: "Garamond", serif;
      font-size: 1.2em;
      padding: 0.2em 0.5em;
      border-radius: 0.3em;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .leaflet-tooltip.leaflet-tooltip-open { opacity: 1; }
    .leaflet-tooltip-bottom:after { border-top-color: #272522 !important; }

    #sidebar {
      position: absolute;
      top: 0; right: 0;
      width: 18vw; height: 100%;
      background: #272522;
      color: #f0e6d2;
      box-shadow: -0.5vw 0 2vw rgba(0,0,0,0.6);
      padding: 2vw;
      overflow-y: auto;
      overflow-x: hidden;   
      word-wrap: break-word;
      transform: translateX(100%);
      transition: transform 0.5s ease;
      z-index: 1000;
    }
    #sidebar.open { transform: translateX(0); }

    #sidebar h2 {
      margin-top: 0;
      font-size: 1.6em;
      color: #ffdf91;
    }

    #cityText {
      line-height: 1.6;
      font-size: 1em;
    }
    #cityText h1, #cityText h2, #cityText h3 { color: #ffdf91; }
    #cityText em { color: #d1c7b3; }
    #cityText strong { color: #fff1b8; }
    #cityText a { color: #ffd884; text-decoration: none; }
    #cityText a:hover { text-decoration: underline; }
    #cityText ul, #cityText ol { margin-left: 1.2em; }

    @media (max-width: 768px) {
      #sidebar {
        width: 100%;
        height: 40vh;
        top: auto; bottom: 0; left: 0; right: 0;
        box-shadow: 0 -0.5vw 2vw rgba(0,0,0,0.6);
        transform: translateY(100%);
      }
      #sidebar.open { transform: translateY(0); }
    }

    #coords {
      position: absolute;
      bottom: 1vw; left: 1vw;
      background: rgba(0,0,0,0.6);
      color: #e0e0e0;
      font-family: monospace;
      font-size: 1vw;
      padding: 0.4vw 0.8vw;
      border-radius: 0.6vw;
      z-index: 1000;
      user-select: none;
    }

    #leftControls {
      position: absolute;
      left: 1vw;
      bottom: 3.5vw;
      z-index: 1200;

      display: flex;
      flex-direction: column;
      gap: 0.2vw;
      align-items: flex-start;
    }

    #tagMenu {
      background: rgba(0, 0, 0, 0.6);
      color: #e0e0e0;
      font-family: monospace;

      padding: 0.6vw 1vw;
      border-radius: 0.6vw;

      display: flex;
      flex-direction: column;
      gap: 0.45vw;
      font-size: 1.1em;
    }

    #tagMenu label {
      display: flex;
      align-items: center;
      gap: 0.3em;
      cursor: pointer;
    }

    #mapSwitchWrapper {
      background: rgba(0,0,0,0.6);
      padding: 0.45vw 0.9vw;
      border-radius: 0.6vw;
      display: flex;
      align-items: center;
      gap: 0.7vw;
    }

    .switchLabel {
      color: #e0e0e0;
      font-family: monospace;
      font-size: 1.05em;
    }

    .switch {
      width: 2.8vw;
      height: 1.4vw;
      background: #444;
      border-radius: 1vw;
      position: relative;
      cursor: pointer;

      transition: background-color 0.25s ease;
    }

    .switch::before {
      content: "";
      position: absolute;
      width: 1.2vw;
      height: 1.2vw;
      background: #ddd;
      border-radius: 50%;
      top: 0.1vw;
      left: 0.1vw;

      transition: transform 0.25s ease, background 0.25s ease;
    }

    .switch.active {
      background-color: #c9a86a;
    }

    .switch.active::before {
      background: #272522;
      transform: translateX(1.4vw);
    }

    @media (max-width: 768px) {

      #leftControls {
        bottom: 6vh;
        gap: 1.2vh;
      }

      #mapSwitchWrapper,
      #tagMenu {
        padding: 1vh 2.2vh;
        font-size: 1em;
      }

      .switch {
        width: 7vh;
        height: 3.5vh;
      }

      .switch::before {
        width: 3vh;
        height: 3vh;
        top: 0.25vh;
        left: 0.25vh;
      }

      .switch.active::before {
        transform: translateX(3.2vh);
      }
    }

    .fade-layer {
      transition: opacity 0.5s ease-in-out;
    }

</style>
</head>
<body>
  <div id="map"></div>
  <div id="coords">x: 0, y: 0</div>

  <div id="leftControls">
    <div id="tagMenu">
      <label><input type="checkbox" value="city" checked> Cities</label>
      <label><input type="checkbox" value="camp" checked> Camps</label>
      <label><input type="checkbox" value="landmark" checked> Landmarks</label>
      <label><input type="checkbox" value="other" checked> Other</label>
    </div>

    <div id="mapSwitchWrapper">
      <span class="switchLabel">Map Labels</span>
      <div id="mapSwitch" class="switch" role="button" aria-pressed="false"></div>
    </div>
  </div>

  <div id="sidebar">
    <h2 id="cityName">City Name</h2>
    <div id="cityText">Click a marker.</div>
  </div>

    text: `### **Region**
        
Named after a cleric of Noctyra who first established many settlements in the area, the Vitruvian Highlands rest in between the Scorched Wastes to the south, and the vast Petalgrave Tundra to the north.

The highlands are a hilly expanse of rocky outcroppings formed at the base of the Sèlean Mountains.

There are many steep rocky cliffs and deep gorges dotting the grassy slopes. The soil quality in the highlands is poor and rocky, leading to agricultural fields being scarce.

The highlands are extremely rich in ores, resulting in certain areas suffering extreme disturbance due to mining practices. While the climate at the southern edge of the highlands is fairly mild, the northern edge of the highlands is bitterly cold. It is not uncommon for the entirety of the green hills to be covered in a thick layer of snow, particularly in the winter months.

The most defining aspect of culture in the Vitruvian Highlands is the prevalence of the Church of Noctyra. Due to the circumstances of the region’s founding, worship of Noctyra is part of daily life in the highlands. That’s not to say worship of Solryn is not uncommon in the highlands, in fact is still often encouraged, but his worship is much less ingrained in the culture.

Most houses in the Vitruvian Highlands keep a small shrine to Noctyra dedicated to personal prayer. 

The Church of Noctyra’s presence in the highlands is such that many of the laws and festivals from the region are derived from Noctyra’s teachings and values, and have had influence further than just this region alone. For example, the Vigils.

The second defining aspect of culture in the highlands is the lack of good soil. The inability to grow crops results in the majority of highlanders living pastoral lifestyles. The remainder of the peasantry generally work in the many mines within the region. The prevalence of ore and wool as resources in the highlands leads to a large class of artisans living and working in the region. Many notable smiths and weavers are from this area. Naturally, the church of Noctyra often commissions works of art dedicated to Noctyra, rarely Solryn, but it provides a bolstering artisan community in the cities of the Highlands.
`

function linkifyReferences(markdown) {
  for (const key in references) {
    const regex = new RegExp(`\\b${key}\\b`, "g"); // exact word match
    markdown = markdown.replace(regex, `<a href="#" class="ref-link" data-ref="${key}">${key}</a>`);
  }
  return markdown;
}

const map = L.map("map", {
  minZoom: -2,
  maxZoom: 2,
  zoom: 0,
  center: [0, 0],
  crs: L.CRS.Simple,
  maxBoundsViscosity: 1.0
});

const bounds = [[0,0],[mapHeight,mapWidth]];

const baseLayer = L.imageOverlay(baseMapURL, bounds, { className: "fade-layer" }).addTo(map);
const labelLayer = L.imageOverlay(labelMapURL, bounds, { className: "fade-layer" });
labelLayer.setOpacity(0);

map.setMaxBounds(bounds);
map.fitBounds(bounds);

const sidebar = document.getElementById("sidebar");
const cityName = document.getElementById("cityName");
const cityText = document.getElementById("cityText");

map.on("click", () => sidebar.classList.remove("open"));

    const markers = [];

locations.forEach(loc => {
  const marker = L.circleMarker([loc.y, loc.x], {
    radius: loc.size,
    fillColor: loc.color,
    color: "#000",
    weight: 1,
    opacity: 1,
    fillOpacity: 0.9
  }).addTo(map);

  marker.tags = loc.tags;
  marker.locData = loc;
  marker.originalRadius = loc.size;

  marker.on("mouseover", () => {
    marker.setRadius(marker.originalRadius * 1.5);
    marker.bindTooltip(loc.name, {
      permanent: false,
      direction: "top",
      offset: [0, -marker.options.radius]
    }).openTooltip();
  });

  marker.on("mouseout", () => {
    marker.setRadius(marker.originalRadius);
    marker.closeTooltip();
  });

  marker.on("click", e => {
    L.DomEvent.stopPropagation(e);
    showReference(loc.name, loc.text);
  });

  markers.push(marker);
});

function showReference(title, markdown) {
  cityName.textContent = title;
  cityText.innerHTML = marked.parse(linkifyReferences(markdown));
  sidebar.classList.add("open");
  setTimeout(() => map.invalidateSize(), 500);
  attachReferenceHandlers();
}

function attachReferenceHandlers() {
  const links = cityText.querySelectorAll(".ref-link");
  links.forEach(link => {
    link.onclick = e => {
      e.preventDefault();
      const key = link.dataset.ref;
      const ref = references[key];
      if (ref) showReference(ref.title, ref.text);
    };
  });
}

attachReferenceHandlers();

const checkboxEls = document.querySelectorAll("#tagMenu input[type=checkbox]");
checkboxEls.forEach(cb =>
  cb.addEventListener("change", () => {
    const selected = [...checkboxEls].filter(c => c.checked).map(c => c.value);
    markers.forEach(m => {
      if (m.tags.some(t => selected.includes(t))) m.addTo(map);
      else m.remove();
    });
  })
);

const coordBox = document.getElementById("coords");
map.on("mousemove", e => {
  coordBox.textContent = `x: ${Math.round(e.latlng.lng)}, y: ${Math.round(e.latlng.lat)}`;
});

const mapSwitch = document.getElementById("mapSwitch");
let labelsOn = false;

mapSwitch.addEventListener("click", () => {
  labelsOn = !labelsOn;
  mapSwitch.classList.toggle("active", labelsOn);
  if (labelsOn) {
    labelLayer.addTo(map);
    setTimeout(() => labelLayer.setOpacity(1), 10);
  } else {
    labelLayer.setOpacity(0);
    setTimeout(() => map.removeLayer(labelLayer), 500);
  }
});
</script>
