<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>don't forget</title>
<style>
  html, body {
    margin: 0; 
    height: 100%;
    width: 100%;
    background: url('../assets/forest.gif');
    background-size: cover;
    image-rendering: pixelated;
    position: relative;
    font-family: monospace;
  }

  .click-area {
    width: 50px;
    height: 50px;
    cursor: pointer;
    background: rgba(212, 0, 255, 0); 
    position: absolute;
    top: 80%;  
    left: 49.2%;
    transform: translate(-50%, 0);
  }

  #poem-container {
    position: absolute;
    top: 7%;
    left: 20px;
    color: rgb(228, 164, 225);
    font-size: 1.8rem;
    white-space: pre-line;
    text-shadow: 0 0 10px rgba(218, 149, 224, 0.863);
    pointer-events: none;
  }
</style>
</head>
<body>
<script src="/header.js"></script>
<div class="click-area" onclick="typePoem(this)"></div>
<div id="poem-container"></div>

<script>
  // Define wait time per line in milliseconds
  const poemData = [
    { text: "I was told that I’d figure it out eventually", delay: 800 },
    { text: "So why, oh why, is the future still opaque?", delay: 800 },
    { text: "Was it all just a lie that time would heal everything?", delay: 800 },
    { text: "Tell me the truth", delay: 800 },
    { text: " ", delay: 1600 },
    { text: "I cry for promises of a better tomorrow", delay: 800 },
    { text: "Don't want a resolution wrapped in sorrow", delay: 800 },
    { text: "What’s the point of a story", delay: 800 },
    { text: "without a happy ending?", delay: 800 },
    { text: " ", delay: 1600 },
    { text: "‘Cause I know even if it didn't even matter", delay: 800 },
    { text: "I’m satisfied to know I’ve won the battle", delay: 800 },
    { text: "At the cost of my heart", delay: 800 },
    { text: "I’ll believe in a future of me", delay: 800 },
    { text: " ", delay: 1600 },
    { text: "Please stay strong, dear future self", delay: 1600 },
  ];

async function typePoem(el) {
  el.remove(); // destroy the click area immediately

  const container = document.getElementById('poem-container');
  container.textContent = ""; 
  for (let lineObj of poemData) {
    await typeLine(lineObj.text, container);
    await wait(lineObj.delay);
  }
}

  function typeLine(line, container) {
    return new Promise(resolve => {
      let i = 0;
      const interval = setInterval(() => {
        container.textContent += line[i];
        i++;
        if (i >= line.length) {
          clearInterval(interval);
          container.textContent += "\n";
          resolve();
        }
      }, 60);
    });
  }

  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }
</script>

<audio id="background-audio" autoplay loop>
  <source src="/assets/chimes.mp3" type="audio/mp3" />
  Your browser does not support the audio element.
</audio>

</body>
</html>
