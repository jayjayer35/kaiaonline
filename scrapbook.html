<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>photo museum</title>
  <link rel="stylesheet" href="/kaia-base.css">
  <link rel="stylesheet" href="/header.css">
  <style>
    body { font-size: 1.5rem; }

    /* ── homey accent tokens ──
       these have fallbacks baked in so the page works even before
       they exist in kaia-base.css — move them there later if you
       want them centrally themeable / different per light-dark. */
    :root {
      --tape-1: #f0c9c4;
      --tape-2: #cfe6c6;
      --tape-3: #f4e2a1;
      --tape-4: #c6dcf0;
      --polaroid-paper: #fdfbf3;
      --polaroid-ink: #3a3226;
      --polaroid-ink-soft: #8a8070;
      --pin-metal: #b9b3a6;
    }

    /* ── page shell ── */
    .museum-shell {
      display: grid;
      grid-template-columns: 17rem 1fr;
      gap: 1rem;
      max-width: 78rem;
      margin: 0 auto;
      padding: 1.25rem;
    }

    .panel-head {
      font-size: 1.5rem;
      text-align: center;
    }

    /* ── sidebar ── */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: sticky;
      top: 1.25rem;
      align-self: start;
    }

    .museum-intro {
      font-size: 1.1rem;
      color: var(--text-soft);
      line-height: 1.5;
      transition: color 0.3s;
    }

    .room-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    /* each room link is a tiny polaroid card, taped up like the photos */
    .room-list li { padding-top: 0.55rem; }

    .room-list li a {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--polaroid-paper);
      border: 1px solid var(--panel-border);
      box-shadow: 2px 3px 7px rgba(0,0,0,0.2);
      padding: 0.45rem 0.6rem;
      text-decoration: none;
      color: var(--polaroid-ink);
      font-size: 1.1rem;
      line-height: 1.2;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .room-list li a .tape {
      width: 2.6rem;
      height: 1rem;
      top: -0.55rem;
      opacity: 0.55;
      transition: opacity 0.15s;
    }

    .room-icon { font-size: 1rem; opacity: 0.85; }

    .room-list li a:hover {
      transform: translateY(-2px);
      box-shadow: 3px 5px 10px rgba(0,0,0,0.25);
    }

    .room-list li a:hover .tape { opacity: 0.75; }

    .room-list li a.active {
      transform: translateY(-2px);
      box-shadow: 3px 5px 10px rgba(0,0,0,0.28);
      font-weight: bold;
    }

    .room-list li a.active .tape { opacity: 0.95; }

    .room-count {
      font-size: 0.85rem;
      color: var(--polaroid-ink-soft);
      margin-left: auto;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.2rem 0;
      border-bottom: 1px solid var(--divider);
      font-size: 1.1rem;
      transition: border-color 0.3s;
    }

    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--text-soft); transition: color 0.3s; }
    .stat-val   { color: var(--text);      transition: color 0.3s; }

    /* ── gallery ── */
    .gallery-area {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .room-section        { display: none; }
    .room-section.active { display: block; }

    /* the room banner is a polaroid too — a plain white card taped up */
    .room-banner {
      position: relative;
      background: var(--polaroid-paper);
      border: 1px solid var(--panel-border);
      box-shadow: 3px 5px 10px rgba(0,0,0,0.2);
      padding: 0.9rem 1.1rem 0.7rem;
      margin-top: 1rem;
    }

    .room-banner .tape {
      width: 4.5rem;
      height: 1.4rem;
      top: -0.75rem;
    }

    .room-banner-title {
      font-size: 1.6rem;
      font-weight: bold;
      letter-spacing: 0.15rem;
      color: var(--polaroid-ink);
    }

    .room-banner-desc {
      font-size: 1rem;
      color: var(--polaroid-ink-soft);
      margin-top: 0.1rem;
    }

    /* ── photo grid ── */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr));
      gap: 2rem 1.5rem;
      margin-top: 1.5rem;
      padding: 0.5rem;
    }

    /* ── exhibit → polaroid on a corkboard wall ── */
    .exhibit {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transform: rotate(var(--rot, 0deg));
      transition: transform 0.2s ease;
    }

    .exhibit:hover {
      transform: rotate(var(--rot, 0deg)) translateY(-4px) scale(1.015);
    }

    .polaroid {
      position: relative;
      background: var(--polaroid-paper);
      border: 1px solid var(--panel-border);
      box-shadow: 3px 5px 10px rgba(0,0,0,0.22);
      padding: 0.55rem 0.55rem 0;
      transition: box-shadow 0.2s;
    }

    .exhibit:hover .polaroid {
      box-shadow: 4px 7px 14px rgba(0,0,0,0.28);
    }

    /* washi tape, stuck on a little crooked */
    .tape {
      position: absolute;
      top: -0.65rem;
      left: 50%;
      width: 3.4rem;
      height: 1.15rem;
      background: var(--tape-color, var(--tape-1));
      opacity: 0.8;
      transform: translateX(-50%) rotate(-5deg);
      box-shadow: 0 1px 2px rgba(0,0,0,0.18);
    }

    .exhibit-photo {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      object-position: center top;
      transition: opacity 0.2s;
    }

    .exhibit:hover .exhibit-photo { opacity: 0.94; }

    .exhibit-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: repeating-linear-gradient(
        45deg,
        var(--panel-border) 0,
        var(--panel-border) 1px,
        transparent 0,
        transparent 50%
      );
      background-size: 0.75rem 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-soft);
      font-size: 1rem;
      letter-spacing: 0.1em;
    }

    /* caption written right on the polaroid's white strip */
    .polaroid-caption {
      padding: 0.5rem 0.2rem 0.7rem;
    }

    .polaroid-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--polaroid-ink);
      line-height: 1.2;
    }

    .polaroid-meta {
      font-size: 0.85rem;
      color: var(--polaroid-ink-soft);
      margin-top: 0.15rem;
      line-height: 1.2;
    }

    /* ── lightbox ── */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(32, 24, 18, 0.87);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      cursor: default;
    }

    #lightbox.open { display: flex; }

    .lb-inner {
      display: flex;
      gap: 1.25rem;
      align-items: flex-start;
      max-width: 70rem;
      width: 100%;
      cursor: default;
    }

    .lb-arrow {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.7);
      font-family: 'NDS', monospace, sans-serif;
      font-size: 2rem;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      align-self: center;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .lb-arrow:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border-color: rgba(255,255,255,0.5);
    }

    .lb-frame-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* big polaroid version for the lightbox */
    .lb-polaroid {
      position: relative;
      background: var(--polaroid-paper);
      border: 1px solid var(--panel-border);
      box-shadow: 6px 8px 0 rgba(0,0,0,0.25);
      padding: 0.75rem 0.75rem 0;
      transform: rotate(-1.2deg);
    }

    .lb-polaroid .tape {
      width: 4.5rem;
      height: 1.4rem;
      top: -0.75rem;
    }

    #lb-img {
      display: block;
      max-width: 100%;
      max-height: 65vh;
      width: 100%;
      object-fit: contain;
    }

    .lb-caption {
      padding: 0.6rem 0.3rem 0.75rem;
    }

    #lb-title {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--polaroid-ink);
    }

    #lb-meta {
      font-size: 0.95rem;
      color: var(--polaroid-ink-soft);
      margin-top: 0.1rem;
    }

    #lb-desc {
      font-size: 1.05rem;
      color: var(--polaroid-ink);
      margin-top: 0.5rem;
      line-height: 1.5;
      -webkit-font-smoothing: none;
      text-rendering: optimizeSpeed;
    }

    .lb-counter {
      font-size: 0.85rem;
      color: var(--polaroid-ink-soft);
      margin-top: 0.5rem;
      text-align: right;
    }

    #lb-close {
      position: fixed;
      top: 0.875rem;
      right: 1rem;
      background: none;
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.7);
      font-family: 'NDS', monospace, sans-serif;
      font-size: 1.5rem;
      padding: 0.1rem 0.5rem;
      cursor: pointer;
      z-index: 10001;
      transition: color 0.15s, background 0.15s;
    }

    #lb-close:hover { color: #fff; background: rgba(255,255,255,0.1); }

    /* ── mobile ── */
    @media (max-width: 56rem) {
      .museum-shell { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .lb-inner { flex-direction: column; }
      .lb-arrow { align-self: auto; }
      .lb-polaroid { transform: none; }
    }
  </style>
</head>

<body>
  <script src="header.js"></script>

<main>
  <div class="museum-shell">

    <aside class="sidebar">

      <div class="panel">
        <div class="panel-head">photo museum</div>
        <div class="panel-body">
          <p class="museum-intro">the photo museum! it is collection of photos and screenshots from everywhere that i wish to produly put on display. <br><br> yes. proudly.</p>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">rooms</div>
        <div class="panel-body" style="padding: 0.375rem 0;">
          <ul class="room-list" id="room-list">
            <!-- filled by JS -->
          </ul>
        </div>
      </div>

      <div class="panel" id="stats-tile">
        <div class="panel-head">exhibit info</div>
        <div class="panel-body">
          <div class="stat-row">
            <span class="stat-label">total photos</span>
            <span class="stat-val" id="stat-total">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">rooms</span>
            <span class="stat-val" id="stat-rooms">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">viewing</span>
            <span class="stat-val" id="stat-viewing">—</span>
          </div>
        </div>
      </div>

    </aside>

    <section class="gallery-area" id="gallery-area">
      <!-- js injects here -->
    </section>

  </div>
</main>

<footer>- kaia (c) 2022 - til the end of time! -</footer>

<!-- lightbox -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button id="lb-close" aria-label="Close">[ x ]</button>
  <div class="lb-inner">
    <button class="lb-arrow" id="lb-prev" aria-label="Previous photo">◄</button>
    <div class="lb-frame-wrap">
      <div class="lb-polaroid">
        <div class="tape" style="background: var(--tape-3);"></div>
        <img id="lb-img" src="" alt="">
        <div class="lb-caption">
          <div id="lb-title"></div>
          <div id="lb-meta"></div>
          <div id="lb-desc"></div>
          <div class="lb-counter" id="lb-counter"></div>
        </div>
      </div>
    </div>
    <button class="lb-arrow" id="lb-next" aria-label="Next photo">►</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════

      { src: "assets/museum/irl/DSC00609.JPG",  title: "shadowed",                            meta: "02-09-2026 · Big Cypress National Preserve, FL", desc: "a photo i took of the moon through a telescope when i was celebrating my birthday with a friend." },

      { src: "assets/museum/irl/unnamed.jpg",   title: "GUARDIAN",                            meta: "??-??-2025 · Miami Beach, FL",                  desc: "a photo i took of myself just before skating, i was really feeling myself here okay... also i named it as a reference to DELTARUNE lol (cause the guardian fight has a big star of light on its face..)" },
      { src: "assets/museum/irl/DSC_0264.JPG",  title: "probably the best photo ive taken like ever", meta: "??-??-???? · San Juan, PR",            desc: "a photo i took while on vacation in puerto rico. i dont know why i like this photo, but its very pleasing to look at" },
      { src: "assets/museum/irl/unnamed2.jpg",  title: "sunscape",                            meta: "??-??-2025 · Puerto Rico",                      desc: "a photo i took while on vacation in puerto rico, a beautiful view" },
    ],
  },
  /* merged this shit with main photos{ 
    id: "friends",
    label: "friends",
    desc: "photos usually taken by my friends, or containing my friends",
    photos: [
      { src: "assets/museum/irl/eroticstevenbrandon.jpg", title: "sexual tension", meta: "??-??-???? · a random parking lot", desc: "dude this is one of the best photos ive take ever" },
    ],
  },*/
  {
    id: "vrc",
    label: "vrchat",
    desc: "screenies and photos of shenanigans and people i meet in vrchat",
    photos: [
      { src: "assets/museum/VRC/VRC_2026-07-03.png", title: "purgatory", meta: "07-03-2026 · VR Chat", desc: "This photo was a great one... ME, Squnk, and Joseph (The girl in middle, Mew mew, and Kris) hopped into a deltarune Green room world, and then proceeded to get lost for 2 hours in an infinite maze. Later, Skiggy (ralsei) showed up and then i respawned out of the maze, found him, and then led him right back to hell where we were. After more exploring we happened to come across someone named Tiki (Mettaton) and then we just wandered and chatted. It went form like 2AM to like 5:30AM in this maze with nothing but us and it was really a fun time, despite us not finding the secret in the maze we heard about. I enjoyed spending time with them a lot as the maze mentally broke us down each bit by bit. Super enjoyable awesome friend bonding time :)"},       
      { src: "assets/museum/VRC/VRC_2026-05-30.png", title: "ghost",                    meta: "05-30-2026 · VR Chat",                      desc: "Squnk, Sixer, and SourReigen (and me!) Just hung out and chatted with them for the night, obligatory photo to remember it :3" },
      { src: "assets/museum/VRC/VRC_2026-05-28.png", title: "unexpected acceptance",    meta: "05-28-2026 · VR Chat (The Black Cat)",       desc: "two freaks that i met that pressed me to speak from the get go. did i? no lmao, but the more i stayed and listened, the more they felt like they wanted to include me, and they were accepting of my voice (and even said it was good?!?) regardless, a fun experience! Also, one of them went to the SAME MIDDLE SCHOOL THAT I DID!? crazy coincedence on vrchat of all places. <br><br> From left to right: Director Bright, Me, DeathIce" },
      { src: "assets/museum/VRC/VRC_2026-05-26.png", title: "'you should put us on your site!'", meta: "05-26-2026 · VR Chat (Fruitiger Aero World)", desc: "a couple people i came across in vrc as i lurked, and they saw my website link and got curious. they loved it and asked to be featured on the site! they kinda inspired this entire page to be constructed. thank you guys as a thanks you will forever be immortalized as the first photo of the vrc section<br><br>From left to right FishoNChips, Romeida, Me, Zynel, Squnk" },

  },
  {
    id: "supercon26",
    label: "supercon 2026",
    desc: "the first time i cosplayed at a con!",
    photos: [
      { src: "assets/museum/supercon2026/cosplay8.jpg", title: "strider time tables!",    meta: "05-16-2026 · my home", desc: "the (almost) final look of them! in this photo theyre not actually glued all together, becuase i need to figure out how to fasten them to my hands for the con! so ill glue them soon, but this is what theyll look like when they're finished. (ill be taking another photo anyway). but for now, i must start work on the knight of time hood cape/cloak (my mother will helps with this because i dont entirely know how to use a sewing machine, or take measurements, or how to work with fabric at all.) " },
      { src: "assets/museum/supercon2026/cosplay7.jpg", title: "final coats of paint",    meta: "05-16-2026 · my home", desc: "heres the \"upper\" side of the gear base, i dont need to paint all of it here, because i will be gluing the mid section there. i also tested some reds on it because that section didn't matter, lol. speaking of gluing, in the back you can see that i have glued the records onto the circle mid sections, weighing them down with my music theory textbook and my old ipad, real classy right" },
      { src: "assets/museum/supercon2026/cosplay6.jpg", title: "first few coats of paint", meta: "05-16-2026 · my home", desc: "in this photo you're looking at the bottom of the time tables. i first painted the whole thing with like 2-3 layers of primer/gesso, cause this foam board can be kinda porous. i would've preferred to spraypaint it on all these stages, but that would literally dissolve the foam, so manually doing it was the only option. oh also the non-gear segment i only painted the rim of white. since something will be glued on top and bottom. (using wood glue, which takes a million fucking years to set ohmygod)" },
      { src: "assets/museum/supercon2026/cosplay4.jpg", title: "foam rough cut 2",         meta: "05-23-2026 · my home", desc: "a better view of the cut panels. after this, i smoothed them out with a knife and sanded them down to be as smooth as i could get them. there is definitely a better way to do this, but this is how i did it." },
      { src: "assets/museum/supercon2026/cosplay5.jpg", title: "foam rough cut",           meta: "05-16-2026 · my home", desc: "i didn't get a photo of the costruction/insulation foam board that i used, but its  1 & 1/2 inches thick (which seemed pretty thick at the time, but in the end it worked out.)" },
      { src: "assets/museum/supercon2026/cosplay3.jpg", title: "time shirt!",              meta: "05-18-2026 · my home", desc: "i got the fabric for the knight of time cape/cloak! and also the shirt... its kinda comfy :3 i ordered the shirt with the decal, and i just have a long sleeve red shirt, which will do for this. i need to get the red sweatpants though!" },
      { src: "assets/museum/supercon2026/cosplay2.jpg", title: "stencil prep!",            meta: "05-16-2026 · my home", desc: "i got some construction board to cut a stencil for the time tables. intially, i was gonna make the prop out of this, but it is too difficult to cut, and too thin in my opinion. i also bought some cheap records from a nearby record store for like a buck each, painted over the label with white acrylic paint, and sanded the other side for gluing later on. wear a mask if you do this!" },
    ],
  },
];

const TAPE_COLORS = ["var(--tape-1)", "var(--tape-2)", "var(--tape-3)", "var(--tape-4)"];

/* ═══════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════ */
const roomList    = document.getElementById("room-list");
const galleryArea = document.getElementById("gallery-area");
const statTotal   = document.getElementById("stat-total");
const statRooms   = document.getElementById("stat-rooms");
const statViewing = document.getElementById("stat-viewing");

let totalPhotos = 0;
ROOMS.forEach(r => totalPhotos += r.photos.length);
statTotal.textContent = totalPhotos;
statRooms.textContent = ROOMS.length;

ROOMS.forEach((room, ri) => {
  /* sidebar link */
  const li = document.createElement("li");
  const a  = document.createElement("a");
  a.href = "#";
  a.dataset.room = room.id;
  a.style.setProperty("--tape-color", TAPE_COLORS[ri % TAPE_COLORS.length]);
  a.innerHTML = `<div class="tape"></div><span class="room-icon">${room.icon || ""}</span>${room.label}<span class="room-count">${room.photos.length}</span>`;
  li.appendChild(a);
  roomList.appendChild(li);

  /* gallery section */
  const section = document.createElement("div");
  section.className = "room-section";
  section.id = `room-${room.id}`;

  const banner = document.createElement("div");
  banner.className = "room-banner";
  banner.innerHTML = `<div class="room-banner-title">${room.label}</div><div class="room-banner-desc">${room.desc}</div>`;
  section.appendChild(banner);

  const grid = document.createElement("div");
  grid.className = "photo-grid";

  room.photos.forEach((photo, pi) => {
    const exhibit = document.createElement("div");
    exhibit.className = "exhibit";
    exhibit.dataset.room = ri;
    exhibit.dataset.idx  = pi;

    /* gentle deterministic wobble so it doesn't look laser-aligned */
    const rot = (((pi * 53 + ri * 29) % 9) - 4) * 0.9;
    exhibit.style.setProperty("--rot", `${rot}deg`);

    const polaroid = document.createElement("div");
    polaroid.className = "polaroid";

    const tape = document.createElement("div");
    tape.className = "tape";
    tape.style.setProperty("--tape-color", TAPE_COLORS[(ri + pi) % TAPE_COLORS.length]);
    polaroid.appendChild(tape);

    if (photo.src) {
      const img = document.createElement("img");
      img.className = "exhibit-photo";
      img.src = photo.src;
      img.alt = photo.title;
      polaroid.appendChild(img);
    } else {
      const ph = document.createElement("div");
      ph.className = "exhibit-placeholder";
      ph.textContent = "[ photo ]";
      polaroid.appendChild(ph);
    }

    const caption = document.createElement("div");
    caption.className = "polaroid-caption";
    caption.innerHTML = `<div class="polaroid-title">${photo.title}</div><div class="polaroid-meta">${photo.meta}</div>`;
    polaroid.appendChild(caption);

    exhibit.appendChild(polaroid);
    exhibit.addEventListener("click", () => openLightbox(ri, pi));
    grid.appendChild(exhibit);
  });

  section.appendChild(grid);
  galleryArea.appendChild(section);
});

/* ── room switching ── */
function showRoom(id) {
  document.querySelectorAll(".room-section").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".room-list a").forEach(a => a.classList.remove("active"));
  const section = document.getElementById(`room-${id}`);
  if (section) section.classList.add("active");
  const link = document.querySelector(`.room-list a[data-room="${id}"]`);
  if (link) link.classList.add("active");
  const room = ROOMS.find(r => r.id === id);
  if (room) statViewing.textContent = room.label;
}

roomList.addEventListener("click", e => {
  const a = e.target.closest("a[data-room]");
  if (!a) return;
  e.preventDefault();
  showRoom(a.dataset.room);
});

showRoom(ROOMS[0].id);

/* ═══════════════════════════════════════════════
   LIGHTBOX
═══════════════════════════════════════════════ */
const lightbox = document.getElementById("lightbox");
const lbImg    = document.getElementById("lb-img");
const lbTitle  = document.getElementById("lb-title");
const lbMeta   = document.getElementById("lb-meta");
const lbDesc   = document.getElementById("lb-desc");
const lbCnt    = document.getElementById("lb-counter");

let lbRoomIdx  = 0;
let lbPhotoIdx = 0;

function openLightbox(roomIdx, photoIdx) {
  lbRoomIdx  = roomIdx;
  lbPhotoIdx = photoIdx;
  renderLightbox();
  lightbox.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  lightbox.classList.remove("open");
  document.body.style.overflow = "";
}

function renderLightbox() {
  const room  = ROOMS[lbRoomIdx];
  const photo = room.photos[lbPhotoIdx];
  lbImg.src           = photo.src || "";
  lbImg.alt           = photo.title;
  lbTitle.textContent = photo.title;
  lbMeta.textContent  = photo.meta;
  lbDesc.innerHTML    = photo.desc || "";
  lbCnt.textContent   = `${lbPhotoIdx + 1} / ${room.photos.length}`;
}

function lbStep(dir) {
  const room = ROOMS[lbRoomIdx];
  lbPhotoIdx = (lbPhotoIdx + dir + room.photos.length) % room.photos.length;
  renderLightbox();
}

document.getElementById("lb-close").addEventListener("click", closeLightbox);
document.getElementById("lb-prev").addEventListener("click", () => lbStep(-1));
document.getElementById("lb-next").addEventListener("click", () => lbStep(1));
lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener("keydown", e => {
  if (!lightbox.classList.contains("open")) return;
  if (e.key === "Escape")     closeLightbox();
  if (e.key === "ArrowLeft")  lbStep(-1);
  if (e.key === "ArrowRight") lbStep(1);
});
</script>
