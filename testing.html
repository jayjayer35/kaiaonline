<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KAIA Status Test</title>
  <style>
    body {
      background: #111;
      color: #0f0;
      font-family: monospace;
      padding: 2rem;
    }
    .line {
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <div class="line" id="health">Health: ...</div>
  <div class="line" id="battery">Social Battery: ...</div>
  <div class="line" id="game">Current Game: ...</div>
  <div class="line" id="availability">Availability: ...</div>

  <script>
    const endpoint = "https://kaia.starscene.com/.netlify/functions/getSteamStatus";

    function updateKaiaStatus() {
      const health = Math.floor(Math.random() * 31) + 70;
      const battery = Math.floor(Math.random() * 101);
      document.getElementById("health").textContent = `Health: ${health}%`;
      document.getElementById("battery").textContent = `Social Battery: ${battery}%`;

      fetch(endpoint)
        .then(res => res.json())
        .then(data => {
          console.log("Steam function data:", data);

          document.getElementById("game").textContent = `Current Game: ${data.game}`;

          const stateMap = {
            "0": "Offline",
            "1": "Online",
            "2": "Busy",
            "3": "Away",
            "4": "Snooze",
            "5": "Looking to Trade",
            "6": "Looking to Play",
            "unknown": "Unknown"
          };

          const status = stateMap[data.status?.toString()] || "Unknown";
          document.getElementById("availability").textContent = `Availability: ${status}`;
        })
        .catch(err => {
          console.error("Fetch error:", err);
          document.getElementById("game").textContent = "Current Game: ???";
          document.getElementById("availability").textContent = "Availability: ???";
        });
    }

    updateKaiaStatus();
  </script>
</body>
</html>
