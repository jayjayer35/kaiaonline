<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the guestbook</title>
<link rel="stylesheet" href="/header.css">
<link rel="stylesheet" href="/kaia-base.css">
<link rel="stylesheet" href="/hide-scrollbars.js">
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.guestbook-split {
    display: flex;
    width: 100%;
    height: 100%;
}

.guestbook-split iframe {
    height: 100%;
    min-width: 0;
    min-height: 0;
    border: none;
    display: block;
}

#draw-frame {
    /* EDIT ME: starting width before anyone drags the resizer */
    flex: 0 0 50%;
}

#atabook-frame {
    flex: 1 1 auto;
}

/* the draggable bar between the two panes */
.resizer {
    flex: 0 0 0.375rem;
    background: var(--panel-border);
    cursor: col-resize;
    touch-action: none;
    transition: background 0.15s;
}

.resizer:hover,
.resizer.dragging {
    background: var(--button-bg-hover);
}

/* prevent iframes from eating mouse/touch events mid-drag */
body.resizing {
    cursor: col-resize;
}
body.resizing .guestbook-split iframe {
    pointer-events: none;
}

/* stack on small screens instead of squeezing side by side */
@media (max-width: 700px) {
    .guestbook-split {
        flex-direction: column;
    }
    .resizer {
        cursor: row-resize;
    }
    body.resizing {
        cursor: row-resize;
    }
}
</style>
</head>
<body>
<script src="header.js"></script>

<div class="guestbook-split">
    <iframe id="draw-frame" src="/drawings.html"></iframe>
    <div class="resizer" id="resizer"></div>
    <iframe id="atabook-frame" src="https://kaiasei.atabook.org/"></iframe>
</div>

<script>
(function () {
    var MIN_PANE = 128;

    var container = document.querySelector('.guestbook-split');
    var drawFrame = document.getElementById('draw-frame');
    var resizer = document.getElementById('resizer');

    var dragging = false;
    var axis = 'x';
    var startPos = 0;
    var startSize = 0;

    function getPoint(e) {
        return e.touches ? e.touches[0] : e;
    }

    function startDrag(e) {
        dragging = true;
        axis = getComputedStyle(container).flexDirection === 'column' ? 'y' : 'x';
        var point = getPoint(e);
        var rect = drawFrame.getBoundingClientRect();
        startPos = axis === 'x' ? point.clientX : point.clientY;
        startSize = axis === 'x' ? rect.width : rect.height;
        document.body.classList.add('resizing');
        resizer.classList.add('dragging');
        e.preventDefault();
    }

    function onMove(e) {
        if (!dragging) return;
        var point = getPoint(e);
        var pos = axis === 'x' ? point.clientX : point.clientY;
        var delta = pos - startPos;

        var containerRect = container.getBoundingClientRect();
        var containerSize = axis === 'x' ? containerRect.width : containerRect.height;
        var resizerRect = resizer.getBoundingClientRect();
        var resizerSize = axis === 'x' ? resizerRect.width : resizerRect.height;

        var maxSize = containerSize - resizerSize - MIN_PANE;
        var newSize = Math.max(MIN_PANE, Math.min(startSize + delta, maxSize));

        drawFrame.style.flexBasis = newSize + 'px';
        e.preventDefault();
    }

    function endDrag() {
        if (!dragging) return;
        dragging = false;
        document.body.classList.remove('resizing');
        resizer.classList.remove('dragging');
    }

    resizer.addEventListener('mousedown', startDrag);
    resizer.addEventListener('touchstart', startDrag, { passive: false });
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);
})();
</script>

</body>
</html>
