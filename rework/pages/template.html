<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kaia online — Topic</title>
  <style>
    @font-face {
      font-family: "NDS";
      src: url("../assets/fonts/nds.ttf") format("truetype");
      font-display: swap;
      image-rendering: pixelated;
      font-smooth: never;
      -webkit-font-smoothing: none;
    }

    :root {
      --bg-tile: #fff;
      --bg-header: #9eb4d1;
      --border-tile: #b6c6df;
      --border-header: #7e8ba3;
      --header-shadow: #9ca7c3;
      --tile-header-bg: #b6c6df;
      --tile-header-border: #8a99b8;
      --text-color: #444;
    }

    body {
      margin: 0;
      font-family: "NDS", sans-serif;
      background: #e8eff7;
      color: var(--text-color);
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }

    header {
      width: 100%;
      background: var(--bg-header);
      border-bottom: 0.2rem solid var(--border-header);
      padding: 0.625rem 0;
      text-align: center;
      box-shadow: 0 0.125rem 0.25rem var(--header-shadow);
      font-weight: bold;
      font-size: 1.75rem;
      position: relative;
    }

    header a {
      margin: 0 0.5rem;
      color: white;
      text-decoration: none;
      position: relative;
      padding: 0.2rem 0.5rem;
    }
    header a:hover { text-decoration: underline; }

    /* Main content */
    main {
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .big-tile {
      background: var(--bg-tile);
      border: 0.15rem solid var(--border-tile);
      border-radius: 1rem;
      padding: 2rem;
      max-width: 60rem;
      width: 100%;
      box-shadow: 4px 4px 0 var(--header-shadow);
    }

    .big-tile h2 {
      background: var(--tile-header-bg);
      color: white;
      margin: -2rem -2rem 1.5rem -2rem;
      padding: 0.7rem;
      border-bottom: 0.15rem solid var(--tile-header-border);
      text-align: center;
      font-size: 1.5rem;
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.8rem;
    }

    /* Dropdown Wrapper */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    /* Dropdown Content */
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #eef3ff;
      border: 1px solid var(--border-header);
      border-radius: 6px;
      box-shadow: 2px 2px 0 var(--border-header);
      z-index: 10;
      
      top: 100%; /* Directly under the header link */
      left: 50%;
      transform: translateX(-50%);
      
      min-width: 8rem;
      font-size: 1.1rem;
      padding: 0.2rem 0;
    }

    /* Links inside dropdown */
    .dropdown-content a {
      display: block;
      padding: 0.4rem 0.8rem;
      text-decoration: none;
      color: var(--text-color);
      white-space: nowrap;
    }

    /* Hover behavior */
    .dropdown-content a:hover {
      background-color: #d6e0f0;
    }

    /* Show dropdown on hover */
    .dropdown:hover .dropdown-content {
      display: block;
    }
  </style>
</head>

    </div>
    <div class="dropdown">

    <div class="dropdown">

      <div class="dropdown-content">
        <a href="rework/pages/blog.html">main blog</a>
        <a href="rework/pages/archive.html">archive(?)</a>
      </div>
    </div>
    <div class="dropdown">
      <a href="#">other</a>
      <div class="dropdown-content">
        <a href="rework/pages/widgets.html">widgets</a>
        <a href="rework/pages/secret.html">secret</a>
      </div>
    </div>
  </header>

<main>
