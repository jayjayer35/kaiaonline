<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>a storm of tomorrow</title>
  <style>
    @font-face {
      font-family: "NDS";
      src: url("rework/assets/fonts/nds.ttf") format("truetype");
      font-display: swap;
      image-rendering: pixelated;
      font-smooth: never;
      -webkit-font-smoothing: none;
    }

    :root {
      --bg-tile: #fff;
      --bg-header: #9eb4d1;
      --border-tile: #b6c6df;
      --border-header: #7e8ba3;
      --header-shadow: #9ca7c3;
      --tile-header-bg: #b6c6df;
      --tile-header-border: #8a99b8;
      --text-color: #444;
      --font-base: 1rem;
      --line-height: 1;
      --custom-font-scale: 1.5;
    }

    html { font-size: var(--font-base); }

    body {
      margin: 0;
      font-family: 'NDS', sans-serif;
      font-size: calc(1rem * var(--custom-font-scale));
      background: #e8eff7 url('rework/assets/general/bkg1.png');
      image-rendering: pixelated;
      color: var(--text-color);
      line-height: var(--line-height);
    }

    footer {
      text-align: center;
      font-size: 80%;
    }

    .banner {
      max-height: 2rem;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .banner img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .wrapper {
      display: flex;
      max-width: 75rem;
      margin: auto;
      gap: 1rem;
      padding: 1.25rem;
      justify-content: center;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .tile {
      background: var(--bg-tile);
      border: 0.15rem solid var(--border-tile);
      border-radius: 0.375rem;
      padding: 0.625rem;
      box-shadow: 0 0 0.25rem var(--header-shadow);
      position: relative;
    }

    .tile h2 {
      background: var(--tile-header-bg);
      color: white;
      margin: -0.625rem -0.625rem 0.625rem -0.625rem;
      padding: 0.375rem;
      font-size: 1.5rem;
      text-align: center;
      border-bottom: 0.15rem solid var(--tile-header-border);
      letter-spacing: .2rem;
    }

    .tile .decor {
      position: absolute;
      width: 2.5rem;
      pointer-events: none;
      user-select: none;
    }

    .corner-top-left { top: -0.4rem; left: -0.4rem; }
    .corner-top-right { top: -0.4rem; right: -0.4rem; }
    .corner-bottom-left { bottom: -0.4rem; left: -0.4rem; }
    .corner-bottom-right { bottom: -0.4rem; right: -0.4rem; }

    /* float animation */
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-0.25rem); }
      100% { transform: translateY(0); }
    }

    .hover { animation: float 2.5s ease-in-out infinite; }
    .hover-float.slow { animation-duration: 4s; }
    .hover-float.fast { animation-duration: 1s; }

    .tile-row {
      display: flex;
      width: 100%;
      align-items: flex-start;
      gap: 1rem;
      margin-top: 1rem;
    }

    .tile-row.reverse {
      flex-direction: row-reverse;
    }

    .side-image {
      width: 6rem; 
      height: auto;
      image-rendering: pixelated;
      flex-shrink: 0;
    }

    .narrow-tile {
      flex: 1;                  
    }

   
    @media (max-width: 56.25rem) {
      .wrapper { flex-direction: column; }
      .tile-row {
        flex-direction: column;
        gap: 0.5rem;
      }
      .side-image {
        margin: 0 auto;
      }
      .narrow-tile { max-width: 100%; }
    }

    @media (max-width: 37.5rem) {
      header { font-size: 0.9rem; padding: 0.5rem 0; }
      .wrapper { padding: 0.625rem; gap: 0.625rem; }
      .tile { font-size: 0.9rem; }
    }

    .piclog-img {
      width: auto;     
      max-width: 100%; 
      height: auto;     
      display: block;
      margin: 0 auto;  
      image-rendering: pixelated; 
    }

    #status-tile #statuscafe {
      padding: 0.5rem;
      background: transparent;          
      border: none;                    
      color: var(--text-color);        
      font-family: 'NDS', sans-serif;   
    }

    #status-tile #statuscafe-username {
      margin-bottom: 0.5rem;
      font-weight: bold;
      font-size: 1rem;
    }

    #status-tile #statuscafe-content {
      margin: 0;
      padding: 0;
      font-size: 1.5rem;
      line-height: .75;
    }

    /* deepest fear poem sequence */
    body {
      position: relative;
      min-height: 100vh;
      transition: background-color 2.8s ease, color 2.8s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: #080912 url('rework/assets/general/bkg1_dark.png');
      image-rendering: pixelated;
      opacity: 0;
      pointer-events: none;
      transition: opacity 2.8s ease;
      z-index: 0;
    }

    body.poem-started {
      background-color: #080912;
      color: #dfe7ff;
    }

    body.poem-started::before { opacity: 1; }

    main { position: relative; z-index: 1; }

    body.poem-started header {
      background: #41506b;
      border-bottom-color: #2d364d;
      box-shadow: 0 0.125rem 0.75rem #080912;
      transition: background 2.8s ease, border-color 2.8s ease, box-shadow 2.8s ease;
    }

    .poem-scene {
      position: relative;
      width: min(44rem, 88vw);
      min-height: 15rem;
      margin: 0 auto;
    }

    body.poem-reading .poem-scene { min-height: 80vh; }

    .poem-tile {
      width: min(30rem, 88vw);
      max-width: 44rem;
      text-align: center;
      overflow: hidden;
      margin: 0 auto;
      transition: opacity 1.8s ease, filter 1.8s ease, background 2.8s ease, border-color 2.8s ease, box-shadow 2.8s ease;
    }

    body.poem-started .poem-tile {
      background: rgba(12, 14, 26, 0.88);
      border-color: #465273;
      box-shadow: 0 0 1.5rem rgba(137, 166, 230, 0.24);
    }

    body.poem-started .poem-tile h2 {
      background: #303a56;
      border-bottom-color: #55658a;
      transition: background 2.8s ease, border-color 2.8s ease;
    }

    body.poem-reading .poem-tile {
      opacity: 0;
      transform: translateY(-0.75rem) scale(0.98);
      filter: blur(0.1rem);
      pointer-events: none;
    }

    .poem-intro {
      margin: 1.4rem auto 1rem;
      max-width: 32rem;
      line-height: 1.2;
    }

    .poem-start-button {
      font-family: 'NDS', sans-serif;
      font-size: 1.35rem;
      color: white;
      background: var(--tile-header-bg);
      border: 0.15rem solid var(--tile-header-border);
      border-radius: 0.1em;
      padding: 0.45rem 1rem;
      cursor: pointer;
      image-rendering: pixelated;
      transition: transform 0.2s ease, background 2.8s ease, border-color 2.8s ease, opacity 1s ease;
    }

    .poem-start-button:hover { transform: scale(1.06); }

    body.poem-started .poem-start-button {
      background: #303a56;
      border-color: #55658a;
      opacity: 0;
      pointer-events: none;
    }

    .poem-stage {
      position: absolute;
      top: 0;
      left: 50%;
      width: min(42rem, 88vw);
      transform: translateX(-50%) translateY(1rem);
      opacity: 0;
      pointer-events: none;
      text-align: center;
      color: #dfe7ff;
      text-shadow: 0 0 0.6rem rgba(8, 9, 18, 0.95);
      transition: opacity 2s ease, transform 2s ease;
    }

    body.poem-reading .poem-stage {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .poem-lines {
      margin: 0 auto;
      padding: 0.5rem 0 4rem;
      line-height: 1.25;
    }

    .poem-line {
      display: block;
      opacity: 0;
      transform: translateY(0.45rem);
      transition: opacity 1.4s ease, transform 1.4s ease;
      margin: 0.25rem 0;
      white-space: pre-wrap;
    }

    .poem-line.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .poem-line.gap { margin-top: 1.2rem; }

    @media (max-width: 37.5rem) {
      .poem-scene { width: min(92vw, 42rem); }
      .poem-tile { width: min(30rem, 92vw); }
      .poem-stage { width: min(42rem, 92vw); }
      .poem-start-button { font-size: 1rem; }
    }

  </style>
</head>
<body>
<script src="header.js"></script>
  <!-- <div class="banner">
    <img src="assets/christmas_lights.png" alt="Banner Image">
  </div> -->

<main>
  <div class="wrapper">
    <div class="column">
      <div class="poem-scene">
        <div class="tile poem-tile">
          <h2>a storm of tomorrow</h2>
          <p class="poem-intro">written by me, for you.</p>
          <button class="poem-start-button" id="startPoem" type="button">begin</button>
        </div>

        <div class="poem-stage" id="poemStage" aria-live="polite">
          <div class="poem-lines" id="poemLines"></div>
        </div>
      </div>
    </div>
  </div>
</main>



<script>
  const poemLines = [
    '“their heart aches,“',
    '',
    '“Not of sadness, look closer.”',
    '',
    '“joy, then?”',
    '',
    '“Something like it.“',
    '“Something fuller.”',
    '',
    '“…and yet they cry”',
    '',
    '“Of course they do.”',
    '',
    '“those tears,“',
    '“they think it means something is wrong”',
    '',
    '“They always do.”',
    '',
    '"confusion floods their mind,',
    '"they can’t make sense of any of it"',
    '',
    '“They aren’t meant to.”',
    '',
    '“…then what is this?”',
    '',
    '“Becoming.”',
    '',
    '“they believe they are breaking,”',
    '',
    '“They are stretching.”',
    '',
    '“into what?”',
    '',
    '',
    '“Someone who can hold this much.”',
    '',
    '“it looks painful”',
    '',
    '“It is.”',
    '',
    '“…should we help?”',
    '',
    '“They would call it silence if we took it away.”',
    '',
    '“look,”',
    '',
    '“Yes.”',
    '',
    '“they’re choosing to stay”',
    '',
    '“They always do.”',
    '',
    '“see how they hold it now?”',
    '',
    '“They’re not asking it to stop anymore,”',
    '',
    '“…no.”',
    '“they’re listening to it.”',
    '',
    '...',
    '',
    '“I do not think this is pain to them.”',
    '',
    '"then what do you think it is?',
    '',
    '"A moment of survivability."',
    '',
    '"do you think they would want this again?"',
    '',
    '"Yes."',
    '"This is the closest they will come to touching everything at once"',
    '',
    '"what will they make of this?"',
    '',
    '"They will call it love."',
  ];


  const startButton = document.getElementById('startPoem');
  const poemContainer = document.getElementById('poemLines');
  let hasStarted = false;

  function buildPoemLines() {
    poemContainer.innerHTML = '';

    poemLines.forEach((text) => {
      const line = document.createElement('span');
      line.className = text === '' ? 'poem-line gap' : 'poem-line';
      line.textContent = text === '' ? '\u00A0' : text;
      poemContainer.appendChild(line);
    });
  }

  startButton.addEventListener('click', () => {
    if (hasStarted) return;
    hasStarted = true;

    document.body.classList.add('poem-started');

    window.setTimeout(() => {
      buildPoemLines();
      document.body.classList.add('poem-reading');

      const lines = poemContainer.querySelectorAll('.poem-line');

      window.setTimeout(() => {
        lines.forEach((line, index) => {
          window.setTimeout(() => {
            line.classList.add('visible');
            line.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }, index * 3000);
        });
      }, 900);
    }, 2800);
  });
</script>

</body>
</html>
