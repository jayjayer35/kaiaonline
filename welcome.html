  .cute-glitch {
  position: relative;
  font-size: 2.8rem;
  font-family: "Comic Sans MS", "Courier New", monospace;
  color: #ffbbf2;
  letter-spacing: 2px;
  text-align: center;
  animation: softGlitch 3s ease-in-out infinite;
}

.cute-glitch::before,
.cute-glitch::after {
  content: attr(data-text);
  position: absolute;
  left: 0;
  width: 100%;
  text-align: center;
  z-index: -1;
}

.cute-glitch::before {
  color: #a5f7ff;
  animation: glitchShift1 3s ease-in-out infinite;
}

.cute-glitch::after {
  color: #ffbbf2;
  animation: glitchShift2 3s ease-in-out infinite;
}

@keyframes glitchShift1 {
  0%, 100% { transform: translate(0, 0); opacity: 0.7; }
  50% { transform: translate(1px, -1px); opacity: 1; }
}

@keyframes glitchShift2 {
  0%, 100% { transform: translate(0, 0); opacity: 0.7; }
  50% { transform: translate(-1px, 1px); opacity: 1; }
}

@keyframes softGlitch {
  0%, 100% { text-shadow: 0 0 1px #ffbbf2; }
  50% { text-shadow: 1px 1px 3px #ffbbf2, -1px -1px 3px #a5f7ff; }
}

  const elem = document.getElementById("random-message");

  function typeWriter(text, i, cb) {
  if (i < text.length) {
    elem.innerHTML += text.charAt(i);
    setTimeout(() => typeWriter(text, i + 1, cb), 50);
  } else {
    setTimeout(cb, 3000); // waits div/1000 sec
  }
}

  function eraseText(cb) {
    const currentText = elem.innerHTML;
    if (currentText.length > 0) {
      elem.innerHTML = currentText.substring(0, currentText.length - 1);
      setTimeout(() => eraseText(cb), 30);
    } else {
      cb();
    }
  }

  function startCycle() {
    const msg = messages[Math.floor(Math.random() * messages.length)];
    typeWriter(msg, 0, () => {
      eraseText(startCycle);
    });
  }
