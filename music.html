<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>the sound of music</title>
<style>
  body {
     text-align: center;
    margin: 0;
    padding: 0;
    font-family: 'Quicksand', sans-serif;
    font-weight: 400;
    font-size:1rem;
    color: #f0e6d2;
    background: #0b0c2a url('assets/1050.GIF');
    background-repeat: no-repeat;      
    background-size: cover;            
    background-position: center center; 
    background-attachment: fixed;       
    margin: 0;                     
    height: 100vh;  
  }
  header {
    text-align: center;
    padding: 3rem 1rem;
    background: rgba(116, 116, 116, 0.479);
    border-bottom: 2px solid #52273f;
  }
  header h1 {
    font-size: 2rem;
    margin: 0;
    color: #c7b8ff;
    text-shadow: 0 0 7px #4e273f;
  }
  .content {
    max-width: 800px;
    margin: 2rem auto;
    padding: 1rem;
    background: rgba(63, 25, 44, 0.726);
    border-radius: 8px;
  }
  .content img {
    max-width: 100%;
    border: 2px solid #3a093f;  
    border-radius: 4px; 
    display: block;
    margin: 1rem auto;
  }
  h2 {
    color: #a878a0;
    text-align: center;
  }
  p {
    line-height: 1.6;
    font-size: 1.3rem;
  }
  footer {
    text-align: center;
    padding: 1rem;
    font-size: 0.9rem;
    color: #1b124d;
  }
  .star {
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.9; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="content">
    <h2>stop looking here its not done!</h2>

  </div>
  <script>
    document.addEventListener('click', () => {
    const sound = new Audio('assets/click.mp3');
    sound.volume = 0.2;
    sound.play();
}, true);
  </script>
</body>
</html>
