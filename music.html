<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Quicksand&display=swap" rel="stylesheet">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>memory bank</title>
<style>
  body {
     text-align: center;
    margin: 0;
    padding: 0;
    font-family: 'Quicksand', sans-serif;
    font-weight: 400;
    font-size:1rem;
    color: #f0e6d2;
    background: #0b0c2a url('assets/vidback.jpg');
    background-repeat: repeat;      
    background-position: center center;
    background-attachment: fixed;         
    image-rendering: pixelated; 
    margin: 0;                        
    height: 100vh;  
  }
  header {
    text-align: center;
    padding: 3rem 1rem;
    background: rgba(45, 20, 50, 0.836);
    border-bottom: 2px solid #691d7c;
  }
  header  {
    text-align: center;
    font-size: 1.5rem;
    margin: 0;
    color: #f8aee8;
    text-shadow: 0 0 0px #aee7f8;
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin: 0;
    color: #f8aee8;
    text-shadow: 0 0 0px #aee7f8;
  }
  .content {
    text-align: center;
    max-width: 1000px;
    margin: 2rem auto;
    padding: 1rem;
    background: rgba(106, 108, 129, 0.521);
    border-radius: 7px;
  }
  .content img {
    text-align: center;
    max-width: 100%;
    border: 1px solid #2a0e33;
    border-radius: 0px;
    display: block;
    margin: 1rem auto;
  }
  h2 {
    text-align: center;
    color: #e7b2e9;
    font-size:2.3rem;
    text-shadow: 0 0 3px #aee7f8;
  }
  p {
    text-align: center;
    width: 60%; /* example */
    margin: 0 auto;
    line-height: 1.6;
    font-size: 1.3rem;
    
  }
  h3 {
    text-align: center;
    font-size: 1.1rem;
    margin: 0;
    color: #f8aee8;
    text-shadow: 0 0 0px #aee7f8;
  }
  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 0.9rem;
    color: #ffffff;
  }
  .star {
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.6; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="content">
    <h2 class="star">the music page is still unfinished</h2>
    <p> listen i dont wanna hear it im still trying to get an idea for this page... my music means a lot to me!
    </p>
  </div>

</body>
<footer>
    <span class="star"></span><br><br>
 </footer>

  <script>
    document.addEventListener('click', () => {
    const sound = new Audio('assets/click.mp3');
    sound.volume = 0.2;
    sound.play();
}, true);
  </script>
</html>
