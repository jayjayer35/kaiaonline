<style>
  html,body{
    height:100%;
    margin:0;
  }
  body{
    background:#000;
    color:#fff;
    font-family: 'Courier New', Courier, monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    cursor:default; 
    overflow:hidden;
  }

  .wrap{
    max-width:90ch;
    width:100%;
  }

  .message{
    font-size:2rem;
    line-height:1.2;
    white-space:pre-wrap;
    word-break:break-word;
    display:inline-block;
    animation:glow 2.4s infinite alternate;
    transition:opacity .5s ease;
    opacity:0; 
    user-select:none; 
  }

  @keyframes glow{
    0%{
      text-shadow: 0 0 1px #fff, 0 0 3px rgba(255,255,255,0.6);
    }
    50%{
      text-shadow: 0 0 3px rgba(255,255,255,0.9), 0 0 9px rgba(255, 255, 255, 0.9), 0 0 14px rgba(255, 255, 255, 0.4);
    }
    100%{
      text-shadow: 0 0 1px #fff, 0 0 3px rgba(255,255,255,0.6);
    }
  }

  .hint{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    font-size:.95rem;
    color:rgba(180,180,180,0.6);
    pointer-events:none;
  }

  ::selection{ background: rgba(255,255,255,0.06); }
</style>
</head>

  <div class="hint" id="hint"></div>
