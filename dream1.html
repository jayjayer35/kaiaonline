  html,body{

    font-family: 'Courier New', Courier, monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    cursor:default; 
    overflow:hidden;
  }

  .wrap{
    max-width:90ch;
    width:100%;
  }

  .message{
    font-size:2rem;
    line-height:1.2;
    white-space:pre-wrap;
    word-break:break-word;
    display:inline-block;
    transition:opacity .5s ease;
    opacity:0; 
    user-select:none; 
  }


  .hint{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    font-size:.95rem;
    color:rgba(180,180,180,0.6);
    pointer-events:none;
  }

  ::selection{ background: rgba(255,255,255,0.06); }
</style>
