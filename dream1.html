<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>dream</title>
<style>
  html,body{
    height:100%;
    margin:0;
  }
  body{
    background:#040014;
    color:rgb(255, 235, 180);
    font-family: 'Courier New', Courier, monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    cursor:default; 
    overflow:hidden;
  }

  .wrap{
    max-width:90ch;
    width:100%;
  }

  .message{
    font-size:2rem;
    line-height:1.2;
    white-space:pre-wrap;
    word-break:break-word;
    display:inline-block;
    transition:opacity .5s ease;
    opacity:0; 
    user-select:none; 
  }


  .hint{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    font-size:.95rem;
    color:rgba(180,180,180,0.6);
    pointer-events:none;
  }

  ::selection{ background: rgba(255,255,255,0.06); }
</style>
</head>
<body>
  <!--"dont meddle in whats not yours" -->
  <!--"i see you, and you see me, but can we see ahead?, these gods have been so damn annoying, havent they"-->
  <div class="wrap">
    <div id="message" class="message" aria-live="polite"><span id="text"></span><span id="cursor" class="cursor" aria-hidden="true"></span></div>
  </div>
  <div class="hint" id="hint"></div>

  <audio id="bgAudio" src="music/lament_balance.mp3" loop preload="auto"></audio>
<script>
const MESSAGES = [
  "WHAT SOME CALL THE SACRED WOUND,", 
  "ONCE AN INSTRUMENT, WELL TUNED",
  "FIND THE PLACE THAT HIDES ITS HEAD,",
  "WHERE THE TRUTH STILL WAITS TO BE READ.",  
  "THE DEATH OF AN EYE RENDERS THE WHOLE WORLD BLIND"
];

const messageEl = document.getElementById("message");
const textEl = document.getElementById("text");
const hintEl = document.getElementById("hint");
const audioEl = document.getElementById('bgAudio');

let userMessage = localStorage.getItem("userMessage");
if (!userMessage) {
  if (Math.random() < 0.05) {
    userMessage = "and at the world’s still hour, three echoes remain. one burned into glass where heaven burned fierce. one with records that remembers all between eons. and lastly, one buried deeper, where the those of the ruin, still persist.";
  } else {
    userMessage = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
  }
  localStorage.setItem("userMessage", userMessage);
}
window.resetUserMessage = function () {
  localStorage.removeItem("userMessage");
  location.reload();
};

function typeWriter(text, speed) {
  messageEl.style.opacity = '1';
  textEl.textContent = '';
  let i = 0;
  return new Promise(resolve => {
    function step() {
      if (i < text.length) {
        textEl.textContent += text.charAt(i);
        i++;
        setTimeout(step, speed);
      } else {
        resolve();
      }
    }
    step();
  });
}

function requestFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen) return el.requestFullscreen();
  if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
  if (el.msRequestFullscreen) return el.msRequestFullscreen();
  return Promise.resolve();
}

let started = false;
document.body.addEventListener("click", async function () {
  if (started) return;
  started = true;
  if (hintEl) hintEl.style.display = "none";

  requestFullscreen().catch(()=>{});

  try {
    await audioEl.play();
  } catch (err) {
    console.warn("Audio play blocked:", err);
  }

  await typeWriter(userMessage, 80);
}, { once: true });
</script>
</body>
</html>
