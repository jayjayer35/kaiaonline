    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    cursor:default;
    overflow:hidden;
    transition: opacity 2s ease; 
  }

  #container {
    display:flex;
    flex-direction:column;
    gap:1rem;
    text-align:center;
    max-width:80%;
  }

  .line {
    font-size:2rem;
    white-space:pre-wrap;
    overflow:hidden;
    animation:glow 2.4s infinite alternate;
  }

  @keyframes glow{
    0%{text-shadow:0 0 2px #fff,0 0 6px rgba(255,255,255,.6);}
    50%{text-shadow:0 0 6px rgba(255,255,255,.9),0 0 18px rgba(255,200,120,.9),0 0 28px rgba(255,200,120,.4);}
    100%{text-shadow:0 0 2px #fff,0 0 6px rgba(255,255,255,.6);}
  }

  .hint{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    font-size:.95rem;
    color:rgba(180,180,180,0.6);
    pointer-events:none;
  }
</style>
