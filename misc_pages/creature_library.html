<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DM Enemy Library</title>

<style>
@font-face{
  font-family:"NDS";
  src:url("rework/assets/fonts/nds.ttf") format("truetype");
  font-display:swap;
}

:root{
  --bg:#0e1116;
  --panel:#151a22;
  --panel2:#1b2130;
  --border:#2b3447;
  --accent:#7e96c9;
  --accent2:#5f74a6;
  --text:#d7deea;
  --muted:#9aa6bd;
}

*{
  box-sizing:border-box;
  cursor:url("rework/assets/cur/kaiacursor.png"),auto;
}

body{
  margin:0;
  font-family:"NDS",sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:var(--panel2);
  border-bottom:2px solid var(--border);
  padding:8px;
  text-align:center;
  font-size:20px;
}

#main{
  display:flex;
  height:calc(100vh - 48px);
}

#nav{
  width:260px;
  background:var(--panel);
  border-right:1px solid var(--border);
  overflow:auto;
  padding:10px;
  transition:all .25s ease;
}

#nav.collapsed{display:none}

#content{
  flex:1;
  overflow:auto;
  padding:20px;
  animation:fadeIn .25s ease;
}

#log{
  width:280px;
  background:var(--panel);
  border-left:1px solid var(--border);
  overflow:auto;
  padding:10px;
  transition:all .25s ease;
}

#log.collapsed{display:none}

.tile{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  padding:12px;
  margin-bottom:14px;
  transition:transform .15s ease, box-shadow .15s ease;
}

.tile:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 12px rgba(0,0,0,.35);
}

.tile h2{
  margin:-12px -12px 10px -12px;
  padding:6px;
  font-size:16px;
  text-align:center;
  background:var(--panel2);
  border-bottom:1px solid var(--border);
  color:var(--accent);
}

.folder{
  font-weight:bold;
  margin-top:10px;
  color:var(--muted);
}

.enemy{
  margin-left:10px;
  cursor:pointer;
  color:var(--accent);
  transition:all .15s ease;
}

.enemy:hover{
  color:white;
  transform:translateX(4px);
}

button{
  background:var(--accent2);
  border:1px solid var(--border);
  color:white;
  padding:6px 10px;
  font-family:"NDS";
  transition:transform .08s ease, background .15s ease;
}

button:hover{background:var(--accent)}
button:active{transform:scale(.96)}

input,textarea{
  width:100%;
  padding:6px;
  border:1px solid var(--border);
  background:#0f141c;
  color:var(--text);
  font-family:"NDS";
}

.statgrid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
  text-align:center;
}

.logEntry{
  border-bottom:1px solid var(--border);
  padding:4px;
  font-size:13px;
  color:var(--muted);
  animation:logFlash .6s ease;
}

.phaseButtons button{
  margin-right:6px;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(4px)}
  to{opacity:1; transform:translateY(0)}
}

@keyframes logFlash{
  0%{background:rgba(126,150,201,.25)}
  100%{background:transparent}
}
</style>
</head>

<body>

<header>
DM ENEMY LIBRARY
<br>
<button onclick="toggleNav()">Toggle Library</button>
<button onclick="toggleLog()">Toggle Dice Log</button>
<button onclick="openBuilder()">New Creature</button>
</header>

<div id="main">

<div id="nav"></div>

<div id="content">
<div class="tile">
<h2>Welcome</h2>
Select a creature from the library.
</div>
</div>

<div id="log">
<div class="tile">
<h2>Dice Log</h2>
<div id="logEntries"></div>
</div>
</div>

</div>

<script>

let creatures = JSON.parse(localStorage.getItem("dm_creatures")||"[]");
let editingIndex = null;

function saveCreatures(){
 localStorage.setItem("dm_creatures",JSON.stringify(creatures));
}

function buildLibrary(){
 const nav=document.getElementById("nav");
 nav.innerHTML='<div class="tile"><h2>Enemies</h2><div id="lib"></div></div>';

 const lib=document.getElementById("lib");
 const folders={};

 creatures.forEach((c,i)=>{
  if(!folders[c.folder]) folders[c.folder]=[];
  folders[c.folder].push({data:c,index:i});
 });

 for(const f in folders){
  const folder=document.createElement("div");
  folder.className="folder";
  folder.textContent=f;
  lib.appendChild(folder);

  folders[f].forEach(obj=>{
   const e=document.createElement("div");
   e.className="enemy";
   e.textContent=obj.data.name;
   e.onclick=()=>loadEnemy(obj.index);
   lib.appendChild(e);
  });
 }
}

function loadEnemy(index){

const c = creatures[index];

let phaseUI="";
if(c.phases && c.phases.length>0){
 phaseUI='<div class="phaseButtons">';
 c.phases.forEach(p=>{
  phaseUI+=`<button onclick="loadEnemy(${p})">Phase</button>`;
 });
 phaseUI+='</div>';
}

const actions=c.actions.map(a=>`
<div class="tile">
<h2>${a.name}</h2>
<p>${a.desc}</p>
<button onclick="roll('${a.roll}','${a.name}')">Roll ${a.roll}</button>
</div>
`).join('');

const stats=`
<div class="tile">
<h2>Stats</h2>
AC ${c.ac} | HP ${c.hp} | Speed ${c.speed}

<div class="statgrid">
<div>STR<br>${c.str}</div>
<div>DEX<br>${c.dex}</div>
<div>CON<br>${c.con}</div>
<div>INT<br>${c.int}</div>
<div>WIS<br>${c.wis}</div>
<div>CHA<br>${c.cha}</div>
</div>

<p><b>Saving Throws:</b> ${c.saves||'-'}</p>
<p><b>Resistances:</b> ${c.resist||'-'}</p>
<p><b>Immunities:</b> ${c.immune||'-'}</p>
<p><b>Cond. Immunities:</b> ${c.cimmune||'-'}</p>
<p><b>Senses:</b> ${c.senses||'-'}</p>
<p><b>Languages:</b> ${c.languages||'-'}</p>
</div>`;

 document.getElementById("content").innerHTML=`
 <div class="tile">
 <h2>${c.name}</h2>
 <p>${c.desc}</p>
 ${phaseUI}
 <button onclick="editCreature(${index})">Edit Creature</button>
 <button onclick="deleteCreature(${index})">Delete Creature</button>
 </div>
 ${stats}
 ${actions}
 `;
}

function openBuilder(data=null,index=null){

editingIndex=index;

const c=document.getElementById("content");

c.innerHTML=`
<div class="tile">
<h2>${data?"Edit Creature":"Create Creature"}</h2>

Name
<input id="c_name" value="${data?.name||''}">

Folder
<input id="c_folder" value="${data?.folder||''}">

Description
<textarea id="c_desc">${data?.desc||''}</textarea>

AC
<input id="c_ac" value="${data?.ac||''}">

HP
<input id="c_hp" value="${data?.hp||''}">

Speed
<input id="c_speed" value="${data?.speed||''}">

<div class="statgrid">
<input id="c_str" placeholder="STR" value="${data?.str||''}">
<input id="c_dex" placeholder="DEX" value="${data?.dex||''}">
<input id="c_con" placeholder="CON" value="${data?.con||''}">
<input id="c_int" placeholder="INT" value="${data?.int||''}">
<input id="c_wis" placeholder="WIS" value="${data?.wis||''}">
<input id="c_cha" placeholder="CHA" value="${data?.cha||''}">
</div>

Saving Throws
<input id="c_saves" value="${data?.saves||''}">

Resistances
<input id="c_resist" value="${data?.resist||''}">

Immunities
<input id="c_immune" value="${data?.immune||''}">

Condition Immunities
<input id="c_cimmune" value="${data?.cimmune||''}">

Senses
<input id="c_senses" value="${data?.senses||''}">

Languages
<input id="c_languages" value="${data?.languages||''}">

<h3>Phases (enter creature names separated by comma)</h3>
<input id="c_phases" value="">

<h3>Actions</h3>
<div id="actions"></div>

<button onclick="addActionField()">Add Action</button>
<br><br>
<button onclick="saveCreature()">Save Creature</button>

</div>
`;

if(data && data.actions){
 data.actions.forEach(a=>addActionField(a));
}else{
 addActionField();
}
}

function editCreature(index){
 openBuilder(creatures[index],index);
}

function deleteCreature(index){
 if(!confirm("Delete this creature?")) return;
 creatures.splice(index,1);
 saveCreatures();
 buildLibrary();
 document.getElementById("content").innerHTML='<div class="tile"><h2>Creature Deleted</h2></div>';
}

function addActionField(action=null){

const container=document.getElementById("actions");

const div=document.createElement("div");
div.className="tile";

div.innerHTML=`
Action Name
<input class="a_name" value="${action?.name||''}">

Description
<textarea class="a_desc">${action?.desc||''}</textarea>

Dice Roll (example 3d10+6)
<input class="a_roll" value="${action?.roll||''}">
`;

container.appendChild(div);
}

function saveCreature(){

const actions=[];

const names=document.querySelectorAll(".a_name");
const descs=document.querySelectorAll(".a_desc");
const rolls=document.querySelectorAll(".a_roll");

for(let i=0;i<names.length;i++){
 if(names[i].value.trim()==="") continue;

 actions.push({
  name:names[i].value,
  desc:descs[i].value,
  roll:rolls[i].value
 });
}

let phases=[];

const creature={
name:document.getElementById("c_name").value,
folder:document.getElementById("c_folder").value,
desc:document.getElementById("c_desc").value,

ac:document.getElementById("c_ac").value,
hp:document.getElementById("c_hp").value,
speed:document.getElementById("c_speed").value,

str:document.getElementById("c_str").value,
dex:document.getElementById("c_dex").value,
con:document.getElementById("c_con").value,
int:document.getElementById("c_int").value,
wis:document.getElementById("c_wis").value,
cha:document.getElementById("c_cha").value,

saves:document.getElementById("c_saves").value,
resist:document.getElementById("c_resist").value,
immune:document.getElementById("c_immune").value,
cimmune:document.getElementById("c_cimmune").value,
senses:document.getElementById("c_senses").value,
languages:document.getElementById("c_languages").value,

phases,
actions
};

if(editingIndex!==null){
 creatures[editingIndex]=creature;
 editingIndex=null;
}else{
 creatures.push(creature);
}

saveCreatures();
buildLibrary();
alert("Creature Saved");
}

function roll(formula,label){

const parts=formula.split("d");
const count=parseInt(parts[0]);

const rest=parts[1].split("+");
const sides=parseInt(rest[0]);
const bonus=rest[1]?parseInt(rest[1]):0;

let total=bonus;
let rolls=[];

for(let i=0;i<count;i++){
 let r=Math.floor(Math.random()*sides)+1;
 rolls.push(r);
 total+=r;
}

log(`${label}: ${formula} -> [${rolls.join(',')}] + ${bonus} = ${total}`);
}

function log(text){
const e=document.createElement("div");
e.className="logEntry";
e.textContent=`[${new Date().toLocaleTimeString()}] ${text}`;
document.getElementById("logEntries").appendChild(e);
}

function toggleNav(){document.getElementById("nav").classList.toggle("collapsed")}
function toggleLog(){document.getElementById("log").classList.toggle("collapsed")}

buildLibrary();

</script>

</body>
</html>
