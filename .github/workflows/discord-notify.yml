name: Notify Discord on Push

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord webhook embed via curl
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          COMMIT_AUTHOR: ${{ github.actor }}
          COMMIT_HASH: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          json=$(cat <<EOF
          {
            "embeds": [{
              "title": "Site update successful",
              "color": 5636604,
              "fields": [
                {"name": "Author", "value": "kaiasei", "inline": true},
                {"name": "Message", "value": "${COMMIT_MSG}"}
              ],
              "footer": {"text": "GitHub Actions"}
            }]
          }
          EOF
          )
          for url in "$WEBHOOK_URL" "$WEBHOOK_URL_2"; do
            if [ -n "$url" ]; then
              curl -H "Content-Type: application/json" -X POST -d "$json" "$url"
            fi
          done